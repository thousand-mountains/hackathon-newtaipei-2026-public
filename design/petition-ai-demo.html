<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訴願決定書 AI 輔助撰擬系統｜新北市政府法制局</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#123B63;--navy-d:#0C2A48;--navy-l:#1E5B93;--seal:#9E2A2B;
  --green:#1B7A4B;--amber:#B07206;--paper:#FAF8F3;--paper-2:#F2EEE4;
  --line:#D8D1C3;--line-2:#E8E3D8;--ink:#1B1B1B;--ink-2:#4A4A4A;--ink-3:#7A7568;--white:#fff;
  --sans:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","PMingLiU",serif;
  --mono:"IBM Plex Mono","Consolas",monospace;
  --shadow:0 1px 2px rgba(18,59,99,.08),0 8px 24px rgba(18,59,99,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper-2);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.mi{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;
  text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;user-select:none;flex:none}
.tip{font-size:16px;color:var(--ink-3);cursor:help;vertical-align:-3px}
.tip:hover,.tip:focus-visible{color:var(--navy-l);outline:none}
#tt{position:fixed;z-index:9999;background:#0C1C2C;color:#E4EEF7;font-size:12.5px;line-height:1.7;padding:7px 10px;
  border-radius:3px;max-width:260px;pointer-events:none;opacity:0;transition:opacity .13s;box-shadow:0 6px 22px rgba(0,0,0,.3);font-family:var(--sans)}
#tt.on{opacity:1}

header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--seal)}
.top .in{max-width:1500px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{font-size:30px;color:#A9C6E0;line-height:1}
.brand .org{font-size:12.5px;letter-spacing:.18em;color:#A9C6E0}
.brand .sys{font-size:18.5px;font-weight:700;letter-spacing:.04em}
.top .sp{flex:1}
.top .who{text-align:right;font-size:12.5px;color:#C9DCEE;line-height:1.5}
.top .who b{color:#fff;font-size:14px;font-weight:500;display:block}

main{max-width:1500px;margin:0 auto;padding:20px}
.page{display:none}
.page.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 18px;border-radius:3px;font-weight:500;letter-spacing:.04em;transition:.15s}
.btn:hover{background:var(--navy-l);border-color:var(--navy-l)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.card{background:var(--white);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow)}
.card>h2{margin:0;font-size:14.5px;font-weight:700;color:var(--navy);padding:10px 15px;border-bottom:1px solid var(--line-2);
  background:linear-gradient(var(--white),#FBFAF7);display:flex;align-items:center;gap:8px}
.card>h2 .bar{width:3px;height:15px;background:var(--seal);border-radius:2px}
.card .body{padding:16px}
.tag{font-size:12px;border-radius:2px;padding:1px 7px;font-weight:500;white-space:nowrap}
.tag.ai{background:#E9F0F7;color:var(--navy-l);border:1px solid #C9DCEE}
.tag.k{background:var(--paper-2);color:var(--ink-3)}
.tag.k2{background:#F3EFE6;color:var(--ink-2);border:1px solid var(--line)}
.tag.n{background:#E9F0F7;color:var(--navy-l)}

/* ---------- 上傳頁 ---------- */
.uwrap{max-width:720px;margin:36px auto}
.uwrap h1{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--navy-d);letter-spacing:.04em;margin:0 0 6px;text-align:center}
.uwrap .sub{text-align:center;color:var(--ink-3);font-size:13.5px;margin:0 0 24px}
.drop{border:2px dashed var(--line);border-radius:5px;background:var(--paper);padding:44px 20px;text-align:center;transition:.18s}
.drop.hot{border-color:var(--navy-l);background:#F0F6FB}
.drop .big{font-size:16px;font-weight:500;margin:10px 0 4px}
.drop .sm{font-size:13px;color:var(--ink-3)}
.files{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.files li{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:3px;padding:9px 12px;background:var(--white);font-size:13.5px;animation:fade .25s}
.files .doc{font-size:21px;color:var(--seal)}
.files .meta{flex:1;min-width:0}
.files .meta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .meta span{font-size:12.5px;color:var(--ink-3)}
.files .ok{color:var(--green);font-size:12.5px;font-weight:500}
.files li>button{border:0;background:none;color:var(--ink-3);font-size:17px;padding:2px 4px}
.ubar{display:flex;gap:12px;align-items:center;margin-top:20px}
.ubar .gap{flex:1}

/* ---------- 撰稿頁 ---------- */
.wbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wbar h1{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--navy-d);letter-spacing:.03em;margin:0}
.wbar .caseno{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.wbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:none;padding:7px 13px;display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.dl{position:relative}
.dlmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--line);border-radius:3px;
  box-shadow:0 10px 30px rgba(0,0,0,.16);min-width:210px;z-index:60;overflow:hidden;display:none}
.dlmenu.on{display:block}
.dlmenu button{width:100%;border:0;background:none;text-align:left;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink)}
.dlmenu button:hover{background:var(--paper)}
.dlmenu button+button{border-top:1px solid var(--line-2)}
.dlmenu .mi{font-size:19px;color:var(--navy)}
.dlmenu small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}

.work{display:grid;grid-template-columns:.86fr 6px 1.14fr;height:calc(100vh - 175px);min-height:600px}
.grip{cursor:col-resize;display:grid;place-items:center}
.grip::after{content:"";width:2px;height:44px;background:var(--line);border-radius:2px}
.grip:hover::after{background:var(--navy-l)}
.leftcol{display:grid;grid-template-rows:1.2fr 1fr;gap:12px;min-height:0}
.pane{background:var(--white);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);min-height:0}
.pane .hd{padding:8px 12px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px;
  background:linear-gradient(var(--white),#FBFAF7);flex:none;flex-wrap:wrap}
.pane .hd .ttl{font-size:13.5px;font-weight:700;color:var(--navy)}
.pane .hd .gap{flex:1}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line-2);background:#FBFAF7;flex:none;align-items:center}
.tab{border:0;background:none;padding:8px 11px;font-size:13.5px;color:var(--ink-3);border-bottom:2.5px solid transparent;font-weight:500}
.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--seal)}
.tab .badge{background:var(--line-2);color:var(--ink-2);border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px;font-family:var(--mono)}
.tab[aria-selected=true] .badge{background:var(--navy);color:#fff}
.tabbody{flex:1;min-height:0;overflow:auto;padding:11px}
.tabpane{display:none}
.tabpane.on{display:block}

/* 法條卡（全國法規資料庫格式） */
.itm{border:1px solid var(--line-2);border-radius:3px;background:var(--white);margin-bottom:9px}
.itm>summary,.itm>.row{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;cursor:pointer;list-style:none}
.itm>summary::-webkit-details-marker{display:none}
.itm .nm{flex:1;font-size:13.5px;font-weight:700;color:var(--navy-d);line-height:1.55}
.itm .chev{color:var(--ink-3);font-size:19px;transition:transform .18s;margin-top:1px}
.itm[open] .chev{transform:rotate(90deg)}
.itm .del{border:0;background:none;color:var(--ink-3);font-size:17px;padding:0 2px;line-height:1.2}
.itm .del:hover{color:var(--seal)}
.itm:hover{border-color:var(--line)}
.itm.hit{border-color:var(--seal);box-shadow:0 0 0 3px rgba(158,42,43,.1);background:#FFFDF6}
.itm.dim{opacity:.4}
.lawdoc{border-top:1px dashed var(--line-2);padding:12px 13px 13px;font-family:var(--serif);font-size:13.5px;line-height:1.95;color:var(--ink-2)}
.lawdoc .fm{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);line-height:1.9;margin-bottom:9px}
.lawdoc .fm b{color:var(--ink-2);font-weight:500}
.lawdoc .ch{font-family:var(--sans);font-size:12.5px;color:var(--navy);font-weight:700;letter-spacing:.1em;padding-left:1em}
.lawdoc .art{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);margin:9px 0 3px}
.lawdoc .art.artfocus{color:var(--seal);border-left:3px solid var(--seal);padding-left:8px;margin-left:-11px}
.lawdoc .artcur{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--white);background:var(--seal);border-radius:2px;padding:1px 6px;vertical-align:1px}
.lawdoc .pa{display:grid;grid-template-columns:1.6em 1fr;gap:2px}
.lawdoc .pn{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px}
.lawdoc .kk{display:block;padding-left:1.6em;text-indent:-1.6em}
.lawdoc .mu{display:block;padding-left:3em;text-indent:-1.6em}
.lawdoc .hl{background:#FFF3CE;border-radius:2px;font-weight:600;color:var(--ink)}
/* 程序審查控制盤 */
.proc{border:1px solid var(--navy);border-radius:3px;background:#F7FAFD;margin-bottom:12px;overflow:hidden}
.proc.hit{border-color:var(--seal);box-shadow:0 0 0 3px rgba(158,42,43,.14);background:#F7FAFD}
.proc.dim{opacity:1}
.proc>.ph{display:flex;align-items:center;gap:7px;padding:9px 11px;background:linear-gradient(#EFF5FB,#F7FAFD);border-bottom:1px solid #DCE7F1}
.proc>.ph .mi{font-size:18px;color:var(--navy)}
.proc>.ph .ttl{font-size:13.5px;font-weight:700;color:var(--navy)}
.proc>.ph .gap{flex:1}
.proc .bd{padding:11px}
.proc label{display:block;font-size:12.5px;color:var(--ink-3);margin:0 0 4px;font-weight:500}
.proc select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--white)}
.proc .fld+.fld{margin-top:9px}
.proc .mainbox{display:flex;gap:9px;align-items:baseline;background:var(--white);border:1px solid var(--line);border-left:3px solid var(--seal);border-radius:3px;padding:8px 11px;margin-top:11px}
.proc .mainbox .lb{font-size:12px;color:var(--ink-3);letter-spacing:.3em;white-space:nowrap}
.proc .mainbox .vl{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--seal)}
.proc ul.note{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-2);line-height:1.85}
.proc .warn{font-size:12px;color:var(--amber);margin-top:9px;display:flex;gap:5px;align-items:flex-start}
.proc .warn .mi{font-size:15px;margin-top:1px}
.aiwhy{background:#F7FAFD;border:1px solid #E2EBF3;border-radius:3px;padding:9px 11px;font-size:12.5px;color:var(--ink-2);line-height:1.7;margin:10px 0 0}
.aiwhy b{display:block;color:var(--navy);font-size:12.5px;margin-bottom:2px;letter-spacing:.03em}
.itm[data-law],.itm[data-caserow]{cursor:pointer}
.itm[data-law] .row,.itm[data-caserow] .row{cursor:pointer}
.seefull{color:var(--navy-l);font-size:12.5px;display:inline-flex;align-items:center;gap:2px;cursor:pointer;border-radius:3px;padding:2px 6px}
.seefull:hover{background:#EDF3F9;text-decoration:underline}
.sim{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.simbar{height:4px;width:52px;background:var(--line-2);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:5px}
.simbar i{display:block;height:100%;background:var(--navy-l)}

/* AI 對話 */
.chat{flex:1;min-height:0;overflow:auto;padding:11px;background:var(--paper);display:flex;flex-direction:column;gap:9px}
.msg{max-width:88%;font-size:13.5px;line-height:1.8;padding:9px 12px;border-radius:4px;animation:fade .22s}
.msg.ai{background:var(--white);border:1px solid var(--line-2);align-self:flex-start}
.msg.me{background:var(--navy);color:#fff;align-self:flex-end}
.msg .qt{font-family:var(--serif);font-size:13px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:8px;margin-bottom:6px;display:block}
.msg .diff{font-family:var(--serif);background:var(--paper);border-left:3px solid var(--green);padding:8px 10px;border-radius:2px;margin-top:7px;font-size:13.5px;line-height:1.9}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:9px 11px 0}
.chips button{border:1px solid var(--line);background:var(--white);border-radius:14px;padding:3px 11px;font-size:12.5px;color:var(--navy-l)}
.chips button:hover{background:#EDF3F9;border-color:var(--navy-l)}
.chatbar{flex:none;border-top:1px solid var(--line-2);padding:9px 11px;display:flex;gap:8px;align-items:flex-end;background:var(--white)}
.chatbar textarea{flex:1;font-size:13.5px;padding:7px 10px;min-height:40px;max-height:100px;border:1px solid var(--line);border-radius:3px;font-family:inherit;resize:vertical}
.chatctx{flex:none;padding:7px 11px 0;font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.chatctx b{color:var(--navy-l);font-weight:500}

/* 稿紙 */
.editor{flex:1;min-height:0;overflow:auto;background:var(--paper-2);padding:18px 0}
.sheet{--lh:34px;width:calc(100% - 34px);margin:0 auto;background:var(--paper);border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.05);padding:var(--lh) 30px calc(var(--lh)*2);
  font-family:var(--serif);font-size:15.5px;line-height:var(--lh);letter-spacing:.04em}
.sheet.view{padding-top:26px}
.sheet .exfm{font-family:var(--sans);font-size:13.5px;line-height:2;color:var(--ink-2);
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:var(--lh)}
.sheet .exfm .rw{display:grid;grid-template-columns:5.6em 1fr;gap:6px;align-items:start}
.sheet .exfm .lb{color:var(--ink-3);letter-spacing:.35em}
.sheet .exfm .vl{color:var(--ink)}
.sheet .exfm .vl .ln{display:block}
.sheet .exfm .addlaw{border:1px solid var(--line);background:var(--white);border-radius:3px;color:var(--navy-l);
  font-size:12.5px;padding:1px 8px;margin-top:3px;display:inline-flex;align-items:center;gap:3px}
.sheet .exfm .addlaw:hover{background:#EDF3F9;border-color:var(--navy-l)}
.sheet.view .exfm .addlaw{display:none}
.sheet .doc-title{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:16.5px;font-weight:600;margin:0}
.sheet .doc-title .no{font-weight:400;font-size:14.5px}
.sheet .meta{font-size:15px;color:var(--ink);padding-left:2em}
.sheet h4{font-size:16px;font-weight:600;letter-spacing:.5em;text-indent:.5em;margin:0;padding-left:2em}
.sheet p{margin:0;text-align:justify;overflow-wrap:break-word}
.sheet p.num{padding-left:2.1em;text-indent:-2.1em}
.sheet p.gapline{height:var(--lh);line-height:var(--lh)}
.sent{border-radius:2px;padding:1px 1px 2px;cursor:pointer;border-bottom:2px solid transparent;transition:background .15s;outline:none;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sheet.edit .sent{border-bottom-color:rgba(30,91,147,.28);cursor:text}
.sent:hover{background:#EDF3F9}
.sent.sel{background:#DCEAF6;border-bottom-color:var(--navy)}
.sent.flash{animation:fl 1.1s ease}
@keyframes fl{0%,100%{background:transparent}30%{background:#FFF1C9}}
.sheet.view .sent{border-bottom-color:transparent}
.sheet.view .sent:hover{background:#F2F6FA}

/* modal */
.mask{position:fixed;inset:0;background:rgba(12,28,44,.55);display:grid;place-items:center;z-index:200;padding:20px;opacity:0;pointer-events:none;transition:opacity .16s}
.mask.on{opacity:1;pointer-events:auto}
.modal{background:var(--white);border-radius:4px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);
  border-top:4px solid var(--navy);transform:translateY(8px);transition:transform .16s;display:flex;flex-direction:column;max-height:88vh}
.mask.on .modal{transform:none}
.modal .mh{padding:15px 20px 0;display:flex;gap:10px;align-items:center;flex:none}
.modal .mh .mi{font-size:22px;color:var(--navy)}
.modal .mh h3{margin:0;font-size:16.5px;color:var(--navy-d);font-family:var(--serif);letter-spacing:.03em}
.modal .mb{padding:13px 20px 6px;font-size:13.5px;color:var(--ink-2);line-height:1.8;overflow:auto;flex:1;min-height:0}
.modal .mf{padding:13px 20px 17px;display:flex;gap:10px;justify-content:flex-end;flex:none;border-top:1px solid var(--line-2)}
input[type=search],textarea{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--white)}
input:focus,textarea:focus{outline:2px solid var(--navy-l);outline-offset:-1px;border-color:var(--navy-l)}
.res{border:1px solid var(--line-2);border-radius:3px;padding:9px 12px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.res:hover{border-color:var(--navy-l);background:#FBFAF7}
.res input{width:16px;height:16px;accent-color:var(--navy);margin-top:3px;flex:none}
.res .t{flex:1}
.res .t b{display:block;font-size:13.5px;color:var(--navy-d)}
.res .t span{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.picked{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 0;border-top:1px dashed var(--line);margin-top:11px}
.pchip{background:#E9F0F7;color:var(--navy);border-radius:14px;padding:2px 6px 2px 11px;font-size:12.5px;display:flex;align-items:center;gap:3px}
.pchip button{border:0;background:none;color:var(--navy-l);font-size:16px;line-height:1;padding:0 2px}
.casedoc{font-family:var(--serif);font-size:14.5px;line-height:2.05;letter-spacing:.03em;white-space:pre-wrap;
  background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px 20px;color:var(--ink)}
.casedoc mark{background:#FFE79A;box-shadow:0 0 0 2px #FFE79A;border-radius:2px;color:var(--ink);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy-d);color:#fff;
  padding:10px 20px;border-radius:3px;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;transition:.28s;z-index:300;border-left:3px solid var(--green)}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1100px){.work{grid-template-columns:1fr;height:auto;gap:12px}.grip{display:none}.leftcol{grid-template-rows:auto auto}.pane{height:420px}}

<!-- ========== 撰稿 ========== -->

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2200)}
(function(){const tt=document.createElement('div');tt.id='tt';document.body.appendChild(tt);let cur=null;
 const show=el=>{cur=el;tt.textContent=el.dataset.tip;tt.classList.add('on');
   const r=el.getBoundingClientRect(),w=tt.offsetWidth,hg=tt.offsetHeight;
   let x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8)),y=r.bottom+7;
   if(y+hg>innerHeight-8)y=r.top-hg-7;tt.style.left=x+'px';tt.style.top=y+'px'};
 const hide=()=>{cur=null;tt.classList.remove('on')};
 document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el&&el!==cur)show(el);else if(!el&&cur)hide()});
 document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)show(el)});
 document.addEventListener('focusout',hide);window.addEventListener('scroll',hide,true)})();
let cCb=null;
function confirmBox(o){$('#c_title').textContent=o.title;$('#c_body').innerHTML=o.body;$('#c_ok').textContent=o.ok||'確定';
  cCb=o.cb;$('#cmask').classList.add('on')}
$('#c_cancel').onclick=()=>{$('#cmask').classList.remove('on');cCb=null};
$('#cmask').addEventListener('click',e=>{if(e.target===$('#cmask')){$('#cmask').classList.remove('on');cCb=null}});
$('#c_ok').onclick=()=>{$('#cmask').classList.remove('on');const f=cCb;cCb=null;f&&f()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.mask.on').forEach(m=>m.classList.remove('on'))});

/* ========== 上傳 ========== */
const DEMO_FILES=[
 {n:'訴願書_1147101517.pdf',s:'412 KB',x:'訴願人 · 3 頁'},
 {n:'原處分書_書面告誡_11312180226-03.pdf',s:'186 KB',x:'警察局汐止分局 · 1 頁'},

 {n:'撤銷函_新北警汐刑字第11442604401號.pdf',s:'152 KB',x:'原處分機關 · 1 頁'}];
function addFile(f,i){
  const li=document.createElement('li');li.style.animationDelay=(i*80)+'ms';
  li.innerHTML='<span class="mi doc">description</span><span class="meta"><b>'+f.n+'</b><span>'+f.s+'　·　'+f.x+
    '</span></span><span class="ok">✓ 已上傳</span><button aria-label="移除">×</button>';
  li.querySelector('button').onclick=()=>{li.remove();syncUp()};
  $('#filelist').appendChild(li);syncUp();
}
function syncUp(){const n=$('#filelist').children.length;
  $('#confirm').disabled=!n;$('#uphint').textContent=n?(n+' 份卷證待解析'):'請先上傳卷證'}
const drop=$('#drop');
drop.onclick=()=>$('#filein').click();
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();loadDemo()}};
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop',e=>{const fs=[...(e.dataTransfer?.files||[])];
  if(fs.length)fs.forEach((f,i)=>addFile({n:f.name,s:Math.round(f.size/1024)+' KB',x:'已上傳'},i));else loadDemo()});
$('#filein').onchange=e=>[...e.target.files].forEach((f,i)=>addFile({n:f.name,s:Math.round(f.size/1024)+' KB',x:'已上傳'},i));
function loadDemo(){$('#filelist').innerHTML='';DEMO_FILES.forEach(addFile)}
$('#demoload').onclick=loadDemo;
$('#confirm').onclick=()=>{
  const b=$('#confirm');b.disabled=true;b.textContent='生成草稿中…';
  setTimeout(()=>{
    $('#p-up').classList.remove('on');$('#p-work').classList.add('on');
    $('#caseno').textContent='案號 1147101517　·　違反洗錢防制法事件';
    buildDoc();b.disabled=false;b.textContent='確認上傳，生成草稿 →';
    window.scrollTo({top:0});
  },1400);
};

function lawHTML(l){
  const hl=k=>(l.rel||[]).includes(k)?' hl':'';
  let h='<div class="fm">法規名稱：<b>'+l.law+'</b><br>修正日期：<b>'+l.date+'</b></div>';
  if(l.ch)h+='<div class="ch">'+l.ch+'</div>';
  if(l.se)h+='<div class="ch">'+l.se+'</div>';
  h+='<div class="art">'+l.art+'</div>';
  if(l.lead)h+='<div>'+l.lead+'</div>';
  const multi=l.paras.length>1;
  l.paras.forEach(p=>{
    let inner='';
    if(p.t)inner+='<span class="'+hl(p.n).trim()+'">'+p.t+'</span>';
    (p.ks||[]).forEach(k=>{inner+='<span class="kk'+hl(k.n)+'">'+k.n+'、'+k.t+'</span>'});
    if(multi&&p.n)h+='<div class="pa"><span class="pn">'+p.n+'</span><span>'+inner+'</span></div>';
    else h+='<div>'+inner+'</div>';
  });
  return h;

const CASETEXT={"C1": {"text": "新北市政府訴願決定書 案號：1137101298 號\n訴願人 藍○\n原處分機關 新北市政府警察局新店分局\n上列訴願人因違反洗錢防制法事件，不服原處分機關民國 113 年 9 月 1 日新北警店刑字第 1134082840 號書面告誡所為之處分，提起訴願一案，本府依法決定如下：\n主 文\n訴願駁回。\n事 實緣訴外人陳○超等 6 人因受詐騙而匯款至訴願人所有之台北富邦商業銀行帳戶（帳戶末 4 碼為 0000） 、中華郵政帳戶（帳戶末 4 碼為 0000） 、中國信託商業銀行帳戶（帳戶末 4 碼為 0000） 、連線商業銀行帳戶（帳戶末 4 碼為 0000 ，以下合稱系爭帳戶）內。原處分機關查得系爭帳戶為訴願人申請設立，遂通知訴願人於民國（下同）113 年 8 月 17 日到案說明，案經原處分機關審查發訴願人無正當理由，於 113 年 8 月 1 日 13 時 7 分於本市○○區○○路○段 41 之 1 號（統一超商青○超市）以交貨便方式，將上揭帳戶提供、交付他人使用，且不符合一般商業、金融交易習慣，或基於親友間信賴關係，認其違反洗錢防制法第 22 條第 1項規定，遂依同條第 2 項規定，以 113 年 9 月 1 日新北警店刑字第 1134082840 號書面告誡（下稱系爭告誡書）裁處告誡。訴願人不服，於 113 年 9 月 5日提起本件訴願，並據原處分機關於 113 年 10 月 3 日檢卷答辯到府。茲摘敘訴辯意旨於次：\n一、訴願意旨略謂：訴願人於 113 年 8 月 4 日上午接獲台北富邦銀行通知其銀行帳戶已被列為警示帳戶，始得知遭詐騙集團騙取銀行帳戶金融卡帳戶作為不法使用，遂主動於當日前往派出所報案。訴願人係因遭詐騙集團施行詐術誤信為了兌獎領取獎金之用，才會將名下金融機構金融卡及密碼提供交付他人使用，故訴願人主觀對於構成要件並無認識，也欠缺主觀故意，其實際上也是詐騙集團施行詐術之受害者，故訴願人並不該當洗錢防制法第 22 條之要件，亦即並非無正當\n理由之情形，故原處分認事用法自有違誤等語。\n二、答辯意旨略謂：訴願人學歷為大學，就學識及社會經驗而言，應認識金融機構帳戶係供個人使用之重要理財及交易工具，關係個人財產及信用之表徵，如任意將自己之金融機構帳戶提供他人使用，可能因此供不法詐騙分子利用以詐術使他人將款項匯入自己之金融機構帳戶後，再予提領運用，並預見可能因而幫助他人從\n事詐欺取財之目的，故訴願人陳稱對構成要件並無認識，顯有可議。又若訴願人所述，其金融機構帳戶若生問題，應係向銀行方訴求處理，而非依未曾謀面之人指示，以交寄方式提供其金融機構帳戶提款卡，並於對話中提供密碼予他人，此行為早已逾越一般商業、金融交易習慣，遑論係屬正當理由等語。\n理 由\n一、按洗錢防制法第 22 條第 1 項、第 2 項規定：「任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限（第 1 項）。違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾 5 年再違反前項規定者，亦同（第 2 項）。」。\n二、卷查訴外人陳○超等 6 人報案陳稱遭詐騙集團詐騙，並依詐騙集團指示匯款至系爭帳戶，原處分機關查得系爭帳戶為訴願人申請設立，遂通知訴願人於 113年 8 月 17 日到案說明，此有原處分機關 113 年 8 月 17 日調查筆錄及 113 年 8 月 18 日第 1134082840 號簽稿等影本附卷可稽，是原處分機關審查\n上開資料後，認訴願人將系爭帳戶交付、提供予他人使用，且不符洗錢防制法第22 條第 1 項但書規定要件，爰依洗錢防制法第 22 條第 2 項規定裁處告誡，揆諸前揭相關規定，洵屬有據。\n三、至訴願人主張因受騙而交付系爭帳戶提款卡及密碼等語。惟查：（一）洗錢防制法於 112 年 6 月 14 日公布增訂第 15 條之 2（即現行第 22 條）之規定，其立法理由第 3 點載明：「三、本條所謂交付、提供帳戶、帳號予他人使用，係指將帳戶、帳號之控制權交予他人，如單純提供、交付提款卡及密碼委託他人代為領錢、提供帳號予他人轉帳給自己等，因相關交易均仍屬本人金流，並非本條所規定之交付、提供『他人』使用。」。因此，行為人將帳戶之控制權已交付他人使用，或提供他人關於帳戶之存摺、提款卡及密碼且非處理屬本人之金流，即為洗錢防制法第 22 條第 1 項規定所稱「交付、提供帳戶、帳號予他人使用」（臺北高等行政法院 113 年度簡字第 243 號行政判決、高雄高等行政法院 113 年度簡字第 125 號行政判決意旨參照）。（二）又 112 年 6 月 14 日修正之洗錢防制法第 15 條之 2（即現行第 22 條）立法理由第 5 點說明：「五、現行實務常見以申辦貸款、應徵工作等方式要求他人交付、提供人頭帳戶、帳號予他人使用，均與一般商業習慣不符，蓋因申辦貸款、應徵工作僅需提供個人帳戶之帳號資訊作為收受貸放款項或薪資之用，並不需要交付、提供予放貸方、資方使用帳戶、帳號支付功能所需之必要物品（例如提款卡、U 盾等）或資訊（例如帳號及密碼、驗證碼等）；易言之，以申辦貸款、應徵工作為由交付或提供帳戶、帳號予他人『使用』，已非屬本條所稱之正當理由。惟倘若行為人受騙而對於構成要件無認識時，因欠缺主觀故意，自不該當本條處罰，併此敘明。」。據此，行為人主張因受詐騙而交付帳戶資料供他人使用，自非屬洗錢防制法第 22 條第 1 項規定但書所稱之「正當理由」，惟仍應探究行為人是否確遭詐騙，對於洗錢防制法第 22 條第1 項規定之構成要件是否毫無認識而得以免責（臺中高等行政法院 113 年度簡字第 21 號行政判決意旨參照）。（三）查本件訴願人主張為領取中獎獎金而郵寄提供系爭帳戶之提款卡予詐騙成員作身分驗證使用，並於通訊軟體提供提款卡密碼，訴願人已將系爭帳戶之控制權交付，且非處理個人之金流，該等情形並不符合一般商業、金融交易習慣，或基於親友間信賴關係，亦不具備其他正當理由，自在洗錢防制法第 22 條第 1項規定禁止之列。又訴願人與詐騙集團成員以通訊軟體對話時曾表示「我能改成上下兩筆匯嗎」、「然後不寄出卡片」、「我可以寄少用的卡片嗎」、「然後批次領」，訴願人於寄出系爭帳戶提款卡後亦向詐騙集團成員表示「那我卡片之後要怎麼拿回來」、「收到時可以和我說嗎」、「保持聯繫可以嗎」，足見訴願人對於交付系爭帳戶提款卡及密碼供其使用，仍有警覺及疑慮。不料訴願人提供系爭帳戶提款卡及密碼後，旋即遭詐騙集團利用作為轉帳匯款之人頭帳戶，自不能認為訴願人對於洗錢防制法第 22 條第 1 項規定不得無正當理由將自己所有之金融帳戶資料交付或提供他人使用一節毫無認識。另訴願人雖表示於 113 年 8 月 4 日向原處分機關所屬青○派出所報案，並提供報案紀錄以供查證，然訴願人已於 113 年 8 月 1 日將系爭帳戶提供予不具信賴關係之詐騙集團，縱使訴願人於 113 年 8 月 4 日向警察機關報案，訴願人對於系爭帳戶於 113 年 8 月 1 日至 113 年 8 月 3 日間有被他人使用之可能性而未加以控管，訴願人縱非故意，亦有過失，是訴願人主張，尚難採據。從而原處分機關認訴願人違反洗錢防制法第 22 條第 1 項之規定，依洗錢防制法第 22 條第 2 項規定裁處告誡處分，於法並無違誤，原處分應予維持。\n四、綜上論結，本件訴願為無理由，爰依訴願法第 79 條第 1 項規定，決定如主文。\n訴願審議委員會主任委員 蔡庭榕委員 陳明燦委員 張文郁委員 蔡進良委員 黃源銘委員 劉宗德委員 景玉鳳委員 王藹芸委員 劉定基委員 董鈺琪委員 林泳玲委員 唐美芝\n如不服本決定，得於決定書送達之次日起 2 個月內向臺北高等行政法院（地址：臺北市士林區福國路 101 號）提起行政訴訟。\n中華民國 113 年 12 月 20 日", "hl": ["交付、提供予他人使用", "不符合一般商業、金融交易習慣", "訴願人不服，於 113 年 9 月 5 日提起本件訴願", "洗錢防制法第 22 條第 1 項"]}, "C2": {"text": "新北市政府訴願決定書 案號：1147101441 號\n訴願人 林○儒\n原處分機關 新北市政府警察局汐止分局\n上列訴願人因違反洗錢防制法事件，不服原處分機關民國 114 年 9 月 7 日新北警汐刑字 1144250329 號書面告誡所為之處分，提起訴願一案，本府依法決定如下：\n主 文\n訴願駁回。\n事 實緣內政部警政署刑事警察局查獲馬○企業有限公司（下稱馬○公司）及豐○生技有限公司（下稱豐○公司）大量收集他人向蝦○拍賣購物平臺申請之帳號，涉犯違反洗錢防制法第 21 條第 1 項規定罪嫌（無正當理由收集他人向提供第三方支付服務之事業申請之帳號），發現訴願人於民國（下同）113 年 2 月 7 日將其向蝦○拍賣購物平臺申請之帳號0000 0000（下稱系爭帳號），以每週賣場營利所得百分之 1.5 作為報酬，交付、提供予馬○公司使用，案經原處分機關於 114 年 9 月 7 日通知\n訴願人到案說明後，認訴願人收受對價將自己向第三方支付服務之事業申請之帳號交付、提供予他人使用，且不符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由，已違反洗錢防制法第 22 條第 1 項及第 3 項第 1 款（期約或收受對價而犯之）規定，依同條第 2 項、第 4 項規定，以 114 年 9 月 7 日新北警汐刑字 1144250329 號書面告誡（下稱系爭告誡書），裁處訴願人告誡。訴願人不服，於 114 年 10 月 16 日提起本件訴願，並據原處分機關檢卷答辯到府。茲摘敘訴辯意旨於次：\n一、訴願意旨略謂：（一）訴願人與馬○公司及豐○公司簽訂蝦○代運營租借授權合作契約書，約定共同經營蝦○賣場，而提供系爭帳號予馬○公司以共同經營。系爭帳號並未有任何隱匿犯罪所得或掩飾來源之不法目的之洗錢行為，且訴願人開設蝦○帳號須實名登記，倘有交易糾紛，亦可清楚追查源頭，自當符合洗錢防制法第 22 條第1 項但書之除外規定。（二）原處分機關並未給予訴願人任何說明解釋機會，即逕為限制訴願人使用金融機構帳戶之權利，原處分機關對訴願人金融帳戶、虛擬資產帳號、第三方支付帳號實施 5 年金融服務限制，自屬限制剝奪人民權利之行政處分，自應踐行行政程序法第 102 條給予訴願人人陳述意見之機會，然原處分機關未給予訴願人說明，即逕作成上開行政處分，程序上自有瑕疵。（三）訴願人僅有將系爭帳號與馬○公司及豐○公司簽約合作，並未交付或提供自己之銀行帳號，而合作期間綁定於系爭帳號進行收款均為同一銀行帳號（且該帳號並未交付或提供給他人使用），並無洗錢防制法第 22 條第 3 項第 2 款（交付、提供之帳戶或帳號合計 3 個以上）之情形等語。\n二、答辯意旨略謂：訴願人提供系爭帳號予馬○公司，取得每週賣場營利所得百分之1. 5 作為酬庸，訴願人係因投資，提供、交付系爭帳號，提供系爭帳戶之報酬係由馬○公司匯入蝦○錢包再轉入訴願人之中華郵政帳戶，惟正常投資獲利應逕由該公司申設之公司帳戶，並將相關獲利匯入，再提供薪資予訴願人之帳戶，反關本案事實與正常公司營運之事實相違。故認交付行為及理由並不符合洗錢防制法第 22 條第 1 項但書之規定等語。\n理 由\n一、按洗錢防制法第 22 條規定：「任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限（第 1 項）。違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾 5 年再違反前項規定者，亦同（第 2項）。違反第 1 項規定而有下列情形之一者，處 3 年以下有期徒刑、拘役或科或併科新臺幣 1 百萬元以下罰金：一、期約或收受對價而犯之。二、交付、提供之帳戶或帳號合計 3 個以上。三、經直轄市、縣（市）政府警察機關依前項或第 4 項規定裁處後，5 年以內再犯（第 3 項）。前項第 1 款或第 2款情形，應依第 2 項規定，由該管機關併予裁處之（第 4 項）。」。\n二、卷查本案訴願人於 113 年 2 月 7 日將系爭帳號以每週賣場營利所得百分之1. 5 作為報酬，交付、提供予他人使用，並依指示將系爭帳號內款項轉出至指定之銀行帳戶，此有調查筆錄、帳號租賃契約書（下稱系爭帳號租賃契約書）等影本附卷可稽，原處分機關認訴願人違反洗錢防制法第 22 條第 1 項及同條第 3 項第 1 款規定，且不符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由，爰依同條第 2 項及第 4 項規定，以系爭告誡書裁處告誡，揆諸前揭規定，洵屬有據。\n三、至訴願人主張未提供銀行帳戶，不符合洗錢防制法第 22 條第 3 項第 2 款之規定且未給予陳述意見之機會等語。惟查：（一）行政程序法 101 第 1 項規定：「行政處分如有誤寫、誤算或其他類此之顯然錯誤者，處分機關得隨時或依申請更正之。」，另行政處分之「追補理由」係指行政處分形式上已記明理由，事後就法律或事實之觀點予以補充或變更，以該追加之理由，在內容上支持行政處分之合法性，原則上並非不得於行政救濟程序中為之，惟必須在作成行政處分時即已存在，不改變行政處分之性質，不妨害當事人之防禦者，始得為之（最高行政法院 109 年度上字第 777 號行政判決參照）。查訴願人提出之系爭書面告誡影本之「理由及其法令依據欄位」經原處分機關勾選「洗錢防制法第 22 條第 3 項第 2 款（違反第 22 條第 1 項規定，且交付、提供之帳戶或帳號）合計 3 個以上…。」，然查原處分機關留存之系爭書面告誡影本之「理由及其法令依據欄位」勾選為「洗錢防制法第 22 條第 3 項第 1 款（期約或收受對價而違反第 22 條第 1 項規定…。」，且系爭告誡書之事實記載為「臺端於 113 年 2 月 7 日期約（期約內容：每週蝦○賣場營業額百分之 1.5），無正當理由將…向蝦○…帳號…交付、提供予他人使用。」。是交付訴願人之系爭告誡書正本之法條依據應係誤載，惟原處分機關於答辯書再次敘明訴願人以每週賣場營業額百分之 1.5 作為提供系爭帳戶之報酬，應認原處分機關已更正或追補系爭告誡書之理由及法令依據為洗錢防制法第 22 條第 3 項第 1 款之規定。（二）洗錢防制法於 112 年 6 月 14 日公布增訂第 15 條之 2（即現行第 22 條）之規定，其增訂理由略以：「…二、有鑑於洗錢係由數個金流斷點組合而成，金融機構、虛擬通貨平台及交易業務之事業以及第三方支付服務業，依本法均負有對客戶踐行盡職客戶審查之法定義務，任何人將上開機構、事業完成客戶審查後同意開辦之帳戶、帳號交予他人使用，均係規避現行本法所定客戶審查等洗錢防制措施之脫法行為，現行實務雖以其他犯罪之幫助犯論處，惟主觀犯意證明困難，影響人民對司法之信賴，故有立法予以截堵之必要。爰此，於第 1 項定明任何人除基於符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由以外，不得將帳戶、帳號交付、提供予他人使用之法定義務，並以上開所列正當理由作為本條違法性要素判斷標準。…惟倘若行為人受騙而對於構成要件無認識時，因欠缺主觀故意，自不該當本條處罰，…。」。又按違反行政法上義務之處罰，除須具備客觀違規行為外，尚以其行為具有主觀歸責事由即故意或過失為必要。所謂故意，係指行為人對於構成違規之事實及該事實係屬違規，明知並有意使其發生者（直接故意），或行為人對於構成違規之事實，預見其發生而其發生並不違背其本意，且知悉該事實係屬違規者（間接故意）而言（最高行政法院 108 年度判字第 531 號判決、109 年度上字第 780 號判決意旨參照）。準此，綜參上揭系爭規定增訂理由及最高行政法院判決意旨，除基於符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由外，只要訴願人將第三方支付服務事業完成客戶審查後同意開辦之帳號交予他人使用，即有法定義務之違反，且不以訴願人主觀上有意藉由自己行為直接促成違反行政法上義務結果為必要，倘該結果發生與自己本意無違，則訴願人\n主觀上即有違法之「間接故意」。故縱使訴願人可能因落入詐騙集團抓準其殷切心理所設下之陷阱，而輕率地將自己帳號控制權交給陌生第三人，就此而言，交付帳號之訴願人固具被害人性質，然只要訴願人主觀上已預見該帳號控制權甚有可能落入他人之手，猶仍漠不在乎且輕率地將之交付他人使用，足以彰顯其具有「違反行政法上義務亦與本意無違」之心態，無異係「直接」將帳號控制權交付他人，並不因訴願人係落入詐欺犯罪者所設陷阱之被害人，而阻卻其違反行政法上義務間接故意之成立。換言之，判斷訴願人主觀上是否具有間接故意，並非在訴願人是否因「被騙」而不知道帳號有可能被非法使用，而係在訴願人是否已預見帳號控制權將可能落入他人之手。（三）查訴願人出租系爭帳號謀取對價，顯不符合洗錢防制法第 22 條第 1 項但書規定之一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由。又參以卷附系爭帳號租賃契約書所載，訴願人需提供帳號及密碼，並確保在契約期間內能正常使用，此已符合洗錢防制法第 22 條所稱將向提供第三方支付服務之事業申請之帳號交付、提供予他人使用之情形。而訴願人於租賃契約書上提供帳號、密碼時，該帳號控制權已落入他人之手，其對帳號之控制權已與第\n三人分享共用，難謂未交付他人使用，或仍保有控制權，則訴願人簽約及提供帳號、密碼時其主觀上已預見該帳號控制權甚有可能落入他人之手，猶仍將之交付他人使用，足以彰顯其具有「違反行政法上義務亦與本意無違」之心態，無異係「直接」將帳號控制權交付他人，並不因訴願人係落入詐欺犯罪者所設陷阱之被害人，而阻卻其違反行政法上義務間接故意之成立。另原處分機關於交付系爭告誡書前已通知訴願人製作調查筆錄，應認已給予訴願人陳述意見之機會，且縱認原處分機關於作成系爭告誡書前有違反行政程序法第 102 條第1 項前段之情形，亦因訴願人提起本件訴願而補正該瑕疵（最高行政法院 111 年度上字第 363 號判決參照）。是原處分機關斟酌全部陳述與調查事實及證據之結果，認定訴願人違反洗錢防制法第 22 條第 1 項及同條第 3 項第1 款規定，依同條第 4 項、第 2 項規定裁處告誡，並無不合。訴願人主張，不足採據，原處分應予維持。\n四、綜上論結，本件訴願為無理由，依訴願法第 79 條第 1 項規定，決定如主文。\n訴願審議委員會主任委員 蔡庭榕（公出）委員 陳明燦（代理）委員 陳立夫委員 張文郁委員 蔡進良委員 黃源銘委員 劉宗德委員 王藹芸委員 劉定基委員 董鈺琪委員 林泳玲委員 唐美芝\n如不服本決定，得於決定書送達之次日起 2 個月內向臺北高等行政法院（地址：臺北市士林區福國路 101 號）提起行政訴訟。\n中華民國 114 年 12 月 31 日", "hl": ["洗錢防制法第 22 條", "法律不溯及既往", "訴願為無理由"]}, "C3": {"text": "新北市政府訴願決定書 案號：1137071244 號\n訴願人 陳○任\n原處分機關 新北市政府警察局三峽分局\n上列訴願人因違反洗錢防制法事件，不服原處分機關民國 113 年 8 月 22 日書面告誡（案件編號：1130498732）所為之處分，提起訴願一案，本府依法決定如下：\n主 文\n訴願駁回。\n事 實緣訴外人陳○瑀報案陳稱遭詐騙集團詐騙，並於民國（下同）113 年 5 月 1 日依詐騙集團指示匯款合計新臺幣（下同）1 萬 5,000 元至中華郵政公司帳戶（帳戶末4 碼為 0000 ，下稱系爭帳戶）內，原處分機關查得系爭帳戶為訴願人替訴願人之子陳○宇（未成年人，000 年 00 月 00 日出生）向中華郵政公司申請設立，遂通知\n訴願人到案說明，惟訴願人經合法通知後無正當理由未到案說明。案經原處分機關審查，認其無正當理由將自己向金融機構申請開立之帳戶提供予他人使用，且不符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由，已違反修正前洗錢防制法第 15 條之 2 第 1 項（113 年 7 月 31 日條次變更為第 22 條第 1 項，內容配合修正條文第 6 條文字修正）本文規定，遂依同條第 2 項（113 年 7月 31 日條次變更為第 22 條第 2 項，內容未修正）規定，以 113 年 8 月 22日書面告誡（案件編號：1130498732，下稱系爭告誡書）裁處告誡。訴願人不服，提起本件訴願，並據原處分機關檢卷答辯到府。茲摘敘訴辯意旨於次：\n一、訴願意旨略謂：訴願人絕無將自己向金融機構申請開立之帳戶提供他人使用等語。\n二、答辯意旨略謂：被害人陳○瑀遭不詳之詐騙集團在 Line 上以猜猜我是誰方式詐騙，於 113 年 5 月 1 日 23 時 18 分以網路轉帳方式匯款至系爭帳戶，經\n原處分機關調閱申登資料，臨櫃申辦人為訴願人，遂於 113 年 8 月 22 日開立系爭告誡書並由訴願人簽收完成，又訴願人經合法通知後無故未到案，送達證書附於後，原處分機關認訴願人無理由等語。\n理 由\n一、按修正前洗錢防制法第 15 條之 2 第 1 項、第 2 項規定：「任何人不得將自己或他人向金融機構申請開立之帳戶、向虛擬通貨平台及交易業務之事業或第\n三方支付服務業申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限（第 1 項）。違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾 5年再違反前項規定者，亦同（第 2 項）。」、113 年 7 月 31 日修正公布後洗錢防制法第 22 條第 1 項、第 2 項規定：「任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限（第 1 項）。違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾 5 年再違反前項規定者，亦同（第 2 項）。」。\n二、卷查訴外人陳○瑀報案陳稱遭詐騙集團詐騙，並依詐騙集團指示匯款至系爭帳戶，原處分機關查得系爭帳戶為訴願人替訴願人之子陳○宇（未成年人，000 年 00 月 00 日出生）向中華郵政公司申請設立，遂通知訴願人到案說明，惟訴願人經合法通知後無正當理由未到案說明，此有原處分機關 113 年 8 月 27 日刑\n事案件報告書等影本附卷可稽，是原處分機關審查上開資料後，認訴願人將系爭帳戶交付、提供予他人使用，且不符洗錢防制法第 15 條之 2 第 1 項但書規定要件，爰依洗錢防制法第 15 條之 2 第 2 項本文規定裁處告誡，揆諸前揭相關規定，洵屬有據。\n三、至訴願人主張絕無將自己向金融機構申請開立之帳戶提供他人使用等語。惟查：（一）洗錢防制法於 112 年 6 月 14 日公布增訂第 15 條之 2（即現行第 22 條）之規定，其增訂理由略以：「…二、有鑑於洗錢係由數個金流斷點組合而成，金融機構、虛擬通貨平台及交易業務之事業以及第三方支付服務業，依本法均負有對客戶踐行盡職客戶審查之法定義務，任何人將上開機構、事業完成客戶審查後同意開辦之帳戶、帳號交予他人使用，均係規避現行本法所定客戶審查等洗錢防制措施之脫法行為，現行實務雖以其他犯罪之幫助犯論處，惟主觀犯意證明困難，影響人民對司法之信賴，故有立法予以截堵之必要。爰此，於第 1 項定明任何人除基於符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由以外，不得將帳戶、帳號交付、提供予他人使用之法定義務，並以上開所列正當理由作為本條違法性要素判斷標準。…惟倘若行為人受騙而對於構成要件無認識時，因欠缺主觀故意，自不該當本條處罰，…。」。又按違反行政法上義務之處罰，除須具備客觀違規行為外，尚以其行為具有主觀歸責事由即故意或過失為必要。所謂故意，係指行為人對於構成違規之事實及該事實係屬違規，明知並有意使其發生者（直接故意），或行為人對於構成違規之事實，預見其發生而其發生並不違背其本意，且知悉該事實係屬違規者（間接故意）而言（最高行政法院 108 年度判字第 531 號判決、109 年度\n上字第 780 號判決意旨參照）。準此，綜參上揭系爭規定增訂理由及最高行政法院判決意旨，除基於符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由外，只要訴願人將機構、事業完成客戶審查後同意開辦之帳戶交予他人使用，即有法定義務之違反，且不以訴願人主觀上有意藉由自己行為直接促成違反行政法上義務結果為必要，倘該結果發生與自己本意無違，則\n訴願人主觀上即有違法之「間接故意」。故縱使訴願人可能因落入詐騙集團抓準其殷切心理所設下之陷阱，而輕率地將自己帳戶控制權交給陌生第三人，就此而言，交付帳戶之訴願人固具被害人性質，然只要訴願人主觀上已預見該帳戶控制權甚有可能落入他人之手，猶仍漠不在乎且輕率地將之交付他人使用，足以彰顯其具有「違反行政法上義務亦與本意無違」之心態，無異係「直接」將帳戶控制權交付他人，並不因訴願人係落入詐欺犯罪者所設陷阱之被害人，而阻卻其違反行政法上義務間接故意之成立。換言之，判斷訴願人主觀上是否具有間接故意，並非在訴願人是否因「被騙」而不知道帳戶有可能被非法使用，而係在訴願人是否已預見帳戶控制權將可能落入他人之手。（二）查本件訴願人雖主張絕無將自己向金融機構申請開立之帳戶提供他人使用，惟查系爭帳戶確有提供他人使用致被害人匯款，該等情形並不符合一般商業、金融交易習慣，或基於親友間信賴關係，亦不具備其他正當理由，自在洗錢防制法第 15 條之 2 第 1 項規定禁止之列。另查金融存款帳戶事關存戶個人財產權益之保障，屬個人理財之工具，若該帳戶之存摺、提款卡、網路銀行帳號及密碼相結合，則專屬性、私密性更形提高，除非本人或與本人具密切親誼關係者，難認有何正當理由可自由流通使用，稍具通常社會歷練與經驗法則之一般人亦均有應妥善保管上開物件、資料，防止被他人冒用之認知，縱須將該等物品、資料交予與自己不具密切親誼之人時，亦必深入瞭解該他人之可靠性與用途，以防止遭他人違反自己意願使用或不法使用之常識，且存摺、提款卡、密碼、網路銀行帳號及密碼等有關個人財產、身分之物品，如淪落於不明人士手中，極易被利用為與財產有關之犯罪工具，可能因此供不法詐騙犯行者利用作為以詐術使他人將款項匯入該帳戶後，再予提領、轉帳順利取得保有詐欺犯行所得贓款，並製造金流斷點，達到掩飾、隱匿犯罪所得之結果，而逃避國家追訴、處罰，此為一般社會大眾所知悉（臺灣新北地方法院 113 年度金訴字第 498 號刑事判決參照）。衡酌訴願人為身心、精神均正常之成年人，應清楚瞭解金融帳戶之相關資訊如交付不具有特別信賴關係之人，可能遭他人非法使用，無從加以控管。是訴願人主張，尚難採據。從而原處分機關認訴願人違反洗錢防制法第 15 條之 2 第 1 項本文之規定，依修正前洗錢防制法第 15 條之 2 第 2 項規定裁處告誡處分，查洗錢防制法於 113 年 7 月 31日修正施行，原第 15 條之 2 移至第 22 條，原處分機關應適用新條文規定裁處，惟因新舊條文規範內容並無不同，原處分其理由或有不當，惟其結論並無二致。是本件原處分依訴願法第 79 條第 2 項規定，於法無違，應予維持。\n四、綜上論結，本件訴願為無理由，爰依訴願法第 79 條第 2 項規定，決定如主文。\n訴願審議委員會主任委員 蔡庭榕委員 陳明燦委員 張文郁委員 蔡進良委員 黃源銘委員 劉宗德委員 景玉鳳委員 王藹芸委員 劉定基委員 董鈺琪委員 林泳玲委員 唐美芝\n如不服本決定，得於決定書送達之次日起 2 個月內向臺北高等行政法院（地址：臺北市士林區福國路 101 號）提起行政訴訟。\n中華民國 113 年 12 月 24 日", "hl": ["原行政處分所憑理由雖屬不當", "訴願為無理由"]}, "C4": {"text": "新北市政府訴願決定書 案號：1137061268 號\n訴願人 胡○倫\n代理人 陳○駿 律師\n代理人 洪○辰 律師\n原處分機關 新北市政府警察局新店分局\n上列訴願人因違反洗錢防制法事件，不服原處分機關民國 113 年 7 月 13 日書面告誡（案件編號：11303210490-01）所為之處分，提起訴願一案，本府依法決定如下：\n主 文\n原處分撤銷，由原處分機關於 2 個月內另為適法之處分。\n事 實緣訴願人於不詳時間，無正當理由將自己向台新國際商業銀行申請開立之帳戶（帳號末 4 碼為 0000 ，下稱系爭帳戶）交付、提供他人使用，案經原處分機關審查，認\n訴願人無正當理由將系爭帳戶交付、提供予他人使用，且不符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由，違反修正前（下同）洗錢防制法第 15 條之 2 第 1 項（民國（下同）113 年 7 月 31 日條次變更為第 22 條第 1項，內容配合修正條文第 6 條文字修正）規定，遂依同條第 2 項（113 年 7 月31 日條次變更為第 22 條第 2 項，內容未修正）規定，以 113 年 7 月 13 日書面告誡（案件編號：11303210490-01）裁處訴願人告誡。訴願人不服，提起本件訴願，並據原處分機關檢卷答辯到府。茲摘敘訴辯意旨於次：\n一、訴願意旨略謂：訴願人為一般網路平台，本會以系爭帳戶與他人進行交易往來，系爭帳戶至今仍在訴願人之管領權限，並無將自己之帳戶交付、提供予他人使用之情形，自無故意或過失之情形。且原處分違反處罰法定原則、法律不溯及既往\n原則、法律保留原則，應予撤銷等語。\n二、答辯意旨略謂：事實：一、本分局於 113 年 7 月 13 日案件編號 11303210490-1 違反洗錢防制法書面告誡。二、上開處分書已於 113 年 7 月 13 日合法送達，並由訴願人親自收領，訴願人不服，於 113 年 8 月 1 日提起訴願等語。\n理 由\n一、按洗錢防制法第 15 條之 2 第 1 項、第 2 項規定：「任何人不得將自己或他人向金融機構申請開立之帳戶、向虛擬通貨平台及交易業務之事業或第三方支付服務業申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限（第 1 項）。違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾 5 年再違反前項規定者，亦同（第 2 項）。」、113 年 7 月 31 日修正公布後洗錢防制法（下稱修正後洗錢防制法）第 22 條第 1 項、第 2 項規定：「任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限（第 1 項）。違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾 5年再違反前項規定者，亦同（第 2 項）。」。\n二、復按訴願法第 58 條第 2 項及第 3 項規定：「原行政處分機關對於前項訴願應先行重新審查原處分是否合法妥當，其認訴願為有理由者，得自行撤銷或變更\n原行政處分，並陳報訴願管轄機關（第 2 項）。原行政處分機關不依訴願人之請求撤銷或變更原行政處分者，應儘速附具答辯書，並將必要之關係文件，送於\n訴願管轄機關（第 3 項）。」。又行政院及各級行政機關訴願審議委員會審議規則第 26 條第 2 項規定：「原行政處分機關答辯欠詳或逾期不答辯，而事實未臻明確者，受理訴願機關得依職權調查事實逕為決定，或認訴願為有理由而逕行撤銷原行政處分，責令另為行政處分，以加重其責任。」。\n三、本件前經原處分機關以 113 年 9 月 20 日新北警店刑字第 1134081092 號函檢送 113 年 8 月 27 日答辯書到府。惟前揭答辯書事實欄並未具體詳述本件違規事實過程（即訴願人如何無正當理由將自己之帳戶交付、提供予他人使用之行為過程），理由欄亦未說明訴願人前揭行為如何符合洗錢防制法第 15 條之 2第 1 項規定，僅於答辯理由就訴願人所主張之事由予以指駁，且未檢附本件相關證據資料。經本府分別以 113 年 10 月 1 日新北府訴行字第 1131960689號及 113 年 10 月 14 日新北府訴行字第 1132030409 號函請原處分機關就前揭應說明事項提出補充答辯書，並載明前揭行政院及各級行政機關訴願審議委員會審議規則第 26 條第 2 項規定，促請注意。然原處分機關迄今亦未就前揭應說明事項提出補充答辯書，亦未檢附相關證據資料，致本件事實未臻明確，依前揭行政院及各級行政機關訴願審議委員會審議規則第 26 條第 2 項規定，爰將\n原處分撤銷，由原處分機關查明後另為適法之處分，以資妥適。\n六、綜上論結，本件訴願為有理由，依訴願法第 81 條規定，決定如主文。\n訴願審議委員會主任委員 蔡庭榕委員 陳明燦委員 陳立夫委員 張文郁委員 蔡進良委員 黃源銘委員 劉宗德委員 景玉鳳委員 李永裕委員 董鈺琪委員 林泳玲委員 唐美芝\n中華民國 113 年 11 月 28 日", "hl": ["原處分撤銷，由原處分機關於 2 個月內另為適法之處分", "系爭帳戶至今仍在訴願人之管領權限", "113 年 7 月 31 日條次變更為第 22 條", "答辯"]}, "C5": {"text": "新北市政府訴願決定書 案號：1147101471 號\n訴願人 林○如\n原處分機關 新北市政府警察局蘆洲分局\n上列訴願人因違反洗錢防制法事件，不服原處分機關民國 112 年 11 月 12 日書面告誡（案件編號：1124430434）所為之處分，提起訴願一案，本府依法決定如下：\n主 文\n訴願不受理。\n理 由\n一、按訴願之提起，應自行政處分達到或公告期滿之次日起 30 日內為之，且以原行政處分機關或受理訴願機關收受訴願書之日期為準。提起訴願逾法定期間者，原處分即歸確定，如仍對之提起訴願，受理訴願機關應為不受理。此觀訴願法第 14 條第 1 項、第 3 項、第 77 條第 2 款之規定甚明。\n二、次按「送達，於應受送達人之住居所、事務所或營業所為之。但在行政機關辦公處所或他處會晤應受送達人時，得於會晤處所為之。」行政程序法第 72 條第 1項定有明文。本件訴願人不服系爭告誡書所為之處分，依首揭規定，自應於行政處分達到之次日起 30 日內提起訴願，逾期未提起者，該行政處分即告確定。\n三、本件訴願人不服原處分機關民國（下同）112 年 11 月 12 日書面告誡（案件編號：1124430434 ，下稱系爭告誡書）於 112 年 11 月 12 日送達訴願人本人，經訴願人簽收在案，又系爭告誡書內亦已教示訴願人不服本處分之救濟方法、期間及其受理機關，此有經訴願人簽收之系爭告誡書影本附卷可稽。核計其提起訴願之 30 日法定期間，應自 112 年 11 月 13 日起算，因訴願人居住所位於本市，毋須扣除在途期間，其訴願期間應至 112 年 12 月 12 日屆滿。惟訴願人遲至 114 年 10 月 20 日始提起訴願，此有訴願書上收文條碼所載日期可考，是其訴願之提起已逾越 30 日之法定不變期間。揆諸首揭條文規定，原處分業已確定，訴願人逾法定期間提起訴願，自非法之所許。本件訴願為程序不合，自不應受理。\n四、綜上論結，本件訴願為程序不合，依訴願法第 77 條第 2 款規定，決定如主文。\n訴願審議委員會主任委員 蔡庭榕（公出）委員 陳明燦（代理）委員 陳立夫委員 張文郁委員 蔡進良委員 黃源銘委員 劉宗德委員 王藹芸委員 劉定基委員 董鈺琪委員 林泳玲委員 唐美芝\n如不服本決定，得於決定書送達之次日起 2 個月內向臺北高等行政法院（地址：臺北市士林區福國路 101 號）提起行政訴訟。\n中華民國 114 年 12 月 31 日", "hl": ["逾法定期間", "訴願法第 77 條第 2 款"]}};

/* 取法條「重點」：優先取螢光筆標記的項/款，否則取首項或 lead */
function lawKeyPoint(l){
  const rel=l.rel||[];
  for(const p of l.paras){
    if(p.t&&rel.includes(p.n))return p.t;
    for(const k of (p.ks||[]))if(rel.includes(k.n))return k.n+'、'+k.t;
  }
  if(l.lead)return l.lead;
  const p0=l.paras[0];
  return p0.t||((p0.ks||[])[0]?(p0.ks[0].n+'、'+p0.ks[0].t):'');
}

function lawArticleHTML(l,focused){
  const hl=k=>(focused&&(l.rel||[]).includes(k))?' hl':'';
  let h='';
  if(l.ch)h+='<div class="ch">'+l.ch+'</div>';

  if(l.lead)h+='<div>'+l.lead+'</div>';
  const multi=l.paras.length>1;
  l.paras.forEach(p=>{
    let inner='';
    if(p.t)inner+='<span class="'+hl(p.n).trim()+'">'+p.t+'</span>';

    else h+='<div>'+inner+'</div>';
  });
  return h;

let picked=[],lawTimer=null;
function fuzzy(q,l){
  q=q.trim().replace(/\s+/g,'');if(!q)return true;
  const hay=(l.law+l.art+l.tag+l.id+l.paras.map(p=>p.t+(p.ks||[]).map(k=>k.t).join('')).join('')).replace(/\s/g,'');
  const num=q.match(/\d+/g)||[],zh=q.replace(/\d+/g,'');
  return (!zh||[...zh].every(c=>hay.includes(c)))&&(!num.length||num.every(n=>l.art.includes(n)||l.id.includes(n)));
}
function renderPicked(){
  const box=$('#lawpicked');box.style.display=picked.length?'flex':'none';
  box.innerHTML=picked.length?('<span style="font-size:12.5px;color:var(--ink-3);align-self:center">已選 '+picked.length+' 條：</span>'+
    picked.map(id=>{const l=lawById(id);return '<span class="pchip">'+l.law+' '+l.art+'<button data-unpick="'+id+'">×</button></span>'}).join('')):'';
  $('#law_ok').disabled=!picked.length;

  const list=LAWDB.filter(l=>!PICK.laws.includes(l.id)&&fuzzy(q,l));

    '<span class="t"><b>'+l.law+'　'+l.art+'</b><span>'+(l.lead||l.paras[0].t).slice(0,54)+'…</span></span>'+

    if(s)$('#ctxone').onclick=()=>{chatAll=false;chatCtx(s)}}

const REWRITE={
 精簡:t=>t.replace(/，惟/g,'，但').replace(/尚難以/g,'難以').replace(/係指/g,'指').replace(/云云/g,'').replace(/，並無溯及適用之情事，/g,'，無溯及適用，'),
 加強:t=>t.replace(/。$/,'，核與卷附事證相符，堪予認定。'),
 回應:t=>t.replace(/。$/,'；訴願人所執前詞，均難謂有據，附此敘明。'),
 語氣:t=>t.replace(/不符/g,'尚有未合').replace(/沒有/g,'並無')};
const LABEL={精簡:'精簡',加強:'加強論述',回應:'補強對訴願主張之回應',語氣:'改為公文正式語氣'};
function applyOne(s,after,src){
  const before=s.t;if(after===before)return false;
  s.t=after;const el=$('#sheet .sent[data-id="'+s.id+'"]');
  if(el){el.textContent=after;el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200)}
  return true;
}
function doRewrite(kind,free){
  if(mode!=='edit'){pushMsg('ai','目前是閱覽模式，請切換到編輯模式後我才能改稿。');return}
  if(!kind&&/法條|條文|加.*條|引用.*法/.test(free||'')){
    pushMsg('ai','增刪法條不在我的職責內——我只做文字層面的潤飾。<br>請用左上角的<b>「加入法條」</b>，加入後再回來請我把它寫進理由欄。');return}
  const fn=kind?REWRITE[kind]:(/拆|兩句|太長/.test(free||'')?(t=>t.replace(/，(?=[^，]{12,})/,'。')):REWRITE.精簡);
  if(chatAll){
    const targets=SENTS.filter(s=>!/^(訴願駁回|訴願不受理|原處分撤銷)/.test(s.t));
    let n=0;targets.forEach(s=>{if(applyOne(s,fn(s.t)))n++});
    updateWC();
    pushMsg('ai',n?('已對全文 '+targets.length+' 句套用「'+(LABEL[kind]||'精簡')+'」，其中 <b>'+n+' 句</b>有實際變動。主文未動。')
      :'全文掃過一遍，沒有需要調整的句子。');
    return;
  }
  const s=selId?byId(selId):null;
  if(!s){pushMsg('ai','請先在右側點選一句。');return}
  const before=s.t;
  if(!applyOne(s,fn(before))){pushMsg('ai','這句已經很精簡，我沒有做更動。');return}
  updateWC();
  pushMsg('ai','已改寫。<span class="qt">原文：'+before+'</span><div class="diff">'+s.t+'</div>');
}

function docHTML(){
  let h='';
  DOC.forEach(b=>{
    if(b.ty==='gap'){h+='<p>　</p>';return}
    if(b.ty==='title'){h+='<div class="t"><span>新北市政府訴願決定書</span><span>案號：1147101517 號</span></div>';return}
    if(b.ty==='meta'){h+='<p class="m">'+b.text+'</p>';return}
    if(b.ty==='h'){h+='<h4>'+b.text+'</h4>';return}
    h+='<p class="'+pcls(b)+'">'+b.ss.map(s=>s.t).join('')+'</p>';
  });
  return h;
}
