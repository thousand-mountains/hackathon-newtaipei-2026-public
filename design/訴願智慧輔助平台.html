<title>訴願智慧輔助平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#1C1F22;
  --ink-2:#3D4348;
  --muted:#6C7379;
  --faint:#9AA1A7;
  --ground:#FFFFFF;
  --panel:#F4F5F6;
  --panel-2:#E9EBED;
  --line:#DBDEE1;
  --line-soft:#E8EAEC;
  --brand:#FFD400;
  --brand-ink:#1C1F22;
  --brand-edge:#E0B900;
  --brand-wash:#FFF8D6;
  --acc:#1F6C8C;
  --acc-2:#1B6180;
  --acc-ink:#FFFFFF;
  --acc-wash:#E9F2F6;
  --ok:#1F6B3E;
  --ok-wash:#E6F1EA;
  --warn:#8A5B0B;
  --warn-wash:#FBF0D8;
  --alert:#A32A22;
  --alert-wash:#F9EAE8;
  --n-doc:#1F6C8C; --n-doc-bg:#E9F2F6;
  --n-fact:#8A6100; --n-fact-bg:#FCF2D2;
  --n-issue:#9B3355; --n-issue-bg:#FAE8EC;
  --n-law:#54479B; --n-law-bg:#ECEAF8;
  --n-out:#1F6B3E; --n-out-bg:#E6F1EA;
  --shadow:0 1px 2px rgba(28,31,34,.06),0 8px 24px rgba(28,31,34,.07);
  --r:4px;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EBEE; --ink-2:#C6CBD0; --muted:#8E969D; --faint:#727A81;
    --ground:#111417; --panel:#181C20; --panel-2:#212629; --line:#2E343A; --line-soft:#252A2F;
    --brand:#FFD400; --brand-ink:#111417; --brand-edge:#B79A00; --brand-wash:#2A2510;
    --acc:#7FBDD8; --acc-2:#6FB0CD; --acc-ink:#0D181D; --acc-wash:#152730;
    --ok:#6BC08D; --ok-wash:#152419; --warn:#DCAB55; --warn-wash:#2A2214;
    --alert:#E58C81; --alert-wash:#2B1A18;
    --n-doc:#7FBDD8; --n-doc-bg:#152730;
    --n-fact:#DCB35A; --n-fact-bg:#2A2414;
    --n-issue:#DE8FA5; --n-issue-bg:#2B1B21;
    --n-law:#A79AE2; --n-law-bg:#201E30;
    --n-out:#6BC08D; --n-out-bg:#152419;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
    --ink:#E8EBEE; --ink-2:#C6CBD0; --muted:#8E969D; --faint:#727A81;
    --ground:#111417; --panel:#181C20; --panel-2:#212629; --line:#2E343A; --line-soft:#252A2F;
    --brand:#FFD400; --brand-ink:#111417; --brand-edge:#B79A00; --brand-wash:#2A2510;
    --acc:#7FBDD8; --acc-2:#6FB0CD; --acc-ink:#0D181D; --acc-wash:#152730;
    --ok:#6BC08D; --ok-wash:#152419; --warn:#DCAB55; --warn-wash:#2A2214;
    --alert:#E58C81; --alert-wash:#2B1A18;
    --n-doc:#7FBDD8; --n-doc-bg:#152730;
    --n-fact:#DCB35A; --n-fact-bg:#2A2414;
    --n-issue:#DE8FA5; --n-issue-bg:#2B1B21;
    --n-law:#A79AE2; --n-law-bg:#201E30;
    --n-out:#6BC08D; --n-out-bg:#152419;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-2);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border:3px solid transparent;background-clip:content-box;border-radius:8px}

/* ── shell ─────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:54px;flex:0 0 auto;
  background:var(--ground);color:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{display:grid;grid-template-columns:6px 6px;grid-template-rows:6px 6px;gap:2px;flex:0 0 auto}
.brand .mark i{display:block;border-radius:1px}
.brand .seal{font-family:var(--serif);font-weight:700;font-size:15.5px;letter-spacing:.08em;white-space:nowrap}
.brand .sys{font-size:12px;letter-spacing:.1em;white-space:nowrap;color:var(--ink-2);
  box-shadow:inset 0 -4px 0 var(--brand);padding:0 2px 1px}
.topbar .spacer{flex:1}
.demo-badge{font-size:11px;letter-spacing:.08em;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:2px;padding:2px 8px;white-space:nowrap}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:var(--r);width:32px;height:32px;display:none;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--panel-2)}
.theme-btn{background:var(--ground);border:1px solid var(--line);border-radius:3px;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-2);padding:0;flex:0 0 auto}
.theme-btn:hover{border-color:var(--brand-edge);background:var(--brand-wash)}
.theme-btn{width:34px;height:32px;color:#E3A200}
.tsw .bite,.tsw .disc,.tsw .rays{transform-box:fill-box;transform-origin:center}
.tsw .bite{transform:translate(11px,-4px);transition:transform .55s cubic-bezier(.45,0,.2,1)}
.tsw .disc{transform:scale(1) rotate(0deg);transition:transform .55s cubic-bezier(.45,0,.2,1)}
.tsw .rays{transform:rotate(0deg) scale(1);opacity:1;
  transition:transform .55s cubic-bezier(.45,0,.2,1),opacity .35s ease}
:root[data-theme="dark"] .theme-btn{color:#F0DFA6}
:root[data-theme="dark"] .tsw .bite{transform:translate(-1.6px,1.2px)}
:root[data-theme="dark"] .tsw .disc{transform:scale(1.22) rotate(-14deg)}
:root[data-theme="dark"] .tsw .rays{transform:rotate(50deg) scale(.4);opacity:0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-btn{color:#F0DFA6}
  :root:not([data-theme="light"]) .tsw .bite{transform:translate(-1.6px,1.2px)}
  :root:not([data-theme="light"]) .tsw .disc{transform:scale(1.22) rotate(-14deg)}
  :root:not([data-theme="light"]) .tsw .rays{transform:rotate(50deg) scale(.4);opacity:0}
}
@media (prefers-reduced-motion:reduce){.tsw .bite,.tsw .disc,.tsw .rays{transition:none}}

.workspace{flex:1;display:flex;min-height:0}
.rail{flex:0 0 auto;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.rail-left{width:248px;border-right:1px solid var(--line)}
.rail-right{width:320px;border-left:1px solid var(--line)}
.rail-head{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;flex:0 0 auto}
.rail-title{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.rail-head .spacer{flex:1}
.mini-btn{background:var(--ground);border:1px solid var(--line);border-radius:3px;padding:2px 7px;font-size:12px;color:var(--ink-2);line-height:1.6}
.mini-btn:hover{border-color:var(--acc-2);color:var(--acc-2)}
.rail-scroll{flex:1;overflow-y:auto;padding:0 8px 16px}

/* ── case tree ─────────────────────────── */
.tree-folder{margin-bottom:2px}
.tree-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:3px;cursor:pointer;user-select:none}
.tree-row:hover{background:var(--panel-2)}
.tree-row .tw{width:12px;flex:0 0 12px;color:var(--faint);font-size:9px;transition:transform .15s}
.tree-row.collapsed .tw{transform:rotate(-90deg)}
.tree-row .fname{font-size:13px;font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .cnt{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tree-children{padding-left:14px}
.tree-children.hidden{display:none}
.case-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:3px;cursor:pointer;border-left:2px solid transparent}
.case-item:hover{background:var(--panel-2)}
.case-item.active{background:var(--ground);border-left-color:var(--brand-edge);box-shadow:0 1px 2px rgba(35,31,23,.06)}
.case-item .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:0 0 6px}
.case-item.active .dot,.case-item.has-work .dot{background:var(--acc-2)}
.case-item .cname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tree-empty{font-size:12px;color:var(--faint);padding:6px 10px 10px}
.tree-row.fixed .fname{color:var(--faint)}
.tree-folder.drop{background:var(--brand-wash);outline:1px dashed var(--brand-edge);outline-offset:-1px;border-radius:3px}
.case-item{cursor:grab}
.case-item.dragging{opacity:.4}
.case-item .grip{margin-left:auto;color:var(--line);font-size:11px;letter-spacing:-1px;opacity:0}
.case-item:hover .grip{opacity:1}
.rail-act{width:27px;height:27px;border:1px solid var(--line);background:var(--ground);border-radius:3px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);padding:0;flex:0 0 auto}
.rail-act:hover{border-color:var(--brand-edge);background:var(--brand-wash);color:var(--ink)}

/* ── chat ──────────────────────────────── */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--ground)}
.chat-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line-soft)}
.chat-head h1{margin:0;font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head .meta{font-family:var(--mono);font-size:11px;color:var(--faint)}
.chat-head .spacer{flex:1}
.stage-strip{display:flex;gap:3px;align-items:center}
.stage-pip{width:22px;height:3px;border-radius:2px;background:var(--line)}
.stage-pip.on{background:var(--brand-edge)}

.stream{flex:1;overflow-y:auto;padding:22px 20px 8px}
.stream-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.msg{display:flex;gap:11px;align-items:flex-start}
.msg.me{justify-content:flex-end}
.msg.me .body{flex:0 1 auto;max-width:82%;background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:12px 12px 3px 12px;padding:9px 13px}
.msg.me .body p{color:var(--ink)}
.msg.me .body .cmdline{font-family:var(--mono);font-size:12.5px;color:var(--acc-2)}
.av{flex:0 0 28px;width:28px;height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.av.user{background:var(--panel-2);color:var(--muted)}
.av.ai{background:var(--acc);color:var(--acc-ink)}
.body{min-width:0;flex:1}
.body p{margin:0 0 .7em}
.body p:last-child{margin-bottom:0}
.body strong{font-weight:700}

.attach-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.file-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.file-chip .ext{font-family:var(--mono);font-size:10px;color:var(--acc-2);text-transform:uppercase}

/* tool block */
.tool{border:1px solid var(--line);border-radius:var(--r);background:var(--ground);overflow:hidden}
.tool-head{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line-soft);border-left:3px solid var(--brand)}
.tool-head .api{font-family:var(--mono);font-size:11px;color:var(--acc-2)}
.tool-head .nm{font-size:12.5px;font-weight:700;letter-spacing:.02em}
.tool-head .st{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--acc-2);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.tool-steps{padding:8px 12px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line-soft)}
.tool-steps:empty{display:none}
.step{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:baseline}
.step .tick{color:var(--ok);font-size:10px}
.step .t{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.tool-out{padding:14px}
.tool-out:empty{display:none}

/* result primitives */
.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
.sec-h{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:7px;padding-bottom:5px;border-bottom:1px solid var(--line-soft)}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.olist{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.olist li::marker{color:var(--acc-2);font-weight:700}

.check{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border-radius:3px;border:1px solid var(--line-soft);background:var(--panel);margin-bottom:5px}
.check:last-child{margin-bottom:0}
.check .bdg{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:2px;margin-top:2px}
.bdg.ok{background:var(--ok-wash);color:var(--ok)}
.bdg.warn{background:var(--warn-wash);color:var(--warn)}
.bdg.alert{background:var(--alert-wash);color:var(--alert)}
.check .ct{font-size:12.5px}
.check .ct b{display:block;font-weight:500;color:var(--ink)}
.check .ct span{color:var(--muted);font-size:12px}

.ccard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);padding:10px 12px;margin-bottom:7px;transition:border-color .12s}
.ccard:last-child{margin-bottom:0}
.ccard:hover{border-color:var(--acc-2)}
.ccard .r1{display:flex;align-items:baseline;gap:8px}
.ccard .no{font-family:var(--mono);font-size:11.5px;color:var(--acc-2)}
.ccard .sim{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ccard .ttl{font-size:13.5px;font-weight:500;margin:2px 0 3px}
.ccard .r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:2px;background:var(--panel-2);color:var(--muted)}
.tag.real{background:var(--acc-wash);color:var(--acc-2)}
.simbar{height:2px;background:var(--line-soft);border-radius:2px;margin-top:8px;overflow:hidden}
.simbar i{display:block;height:100%;background:var(--acc-2)}

.lawrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.lawrow:last-child{border-bottom:0}
.lawrow .lno{font-family:var(--mono);font-size:11px;color:var(--acc-2);flex:0 0 auto;padding-top:2px}
.lawrow .lt{font-size:13px}
.lawrow .lt em{font-style:normal;color:var(--muted);font-size:12px;display:block}

.draft{font-family:var(--serif);font-size:14.5px;line-height:2.05;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.draft h4{font-family:var(--sans);font-size:11px;letter-spacing:.16em;color:var(--muted);margin:16px 0 6px;font-weight:700}
.draft h4:first-child{margin-top:0}
.draft p{margin:0 0 .55em;text-align:justify}
.draft .indent{text-indent:2em}
.cite{font-family:var(--sans);font-size:10.5px;color:var(--acc-2);background:var(--acc-wash);border-radius:2px;padding:0 4px;margin-left:3px;white-space:nowrap;vertical-align:.08em}
.nohallu{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border:1px dashed var(--line);border-radius:3px;font-size:12px;color:var(--muted)}

.diffdel{background:var(--alert-wash);color:var(--alert);text-decoration:line-through;text-decoration-thickness:1px}
.diffadd{background:var(--ok-wash);color:var(--ok)}

/* suggestion chips */
.composer-wrap{flex:0 0 auto;padding:0 20px 16px}
.composer-inner{max-width:760px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 9px}
.chip{border:1px solid var(--line);background:var(--ground);border-radius:999px;padding:4px 13px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:all .12s}
.chip:hover{border-color:var(--acc-2);color:var(--acc-2);background:var(--acc-wash)}
.chip .lead{color:var(--acc-2);font-size:11px}
.chip.ghost{border-style:dashed;color:var(--muted)}

.composer{border:1px solid var(--line);border-radius:var(--r);background:var(--ground);box-shadow:var(--shadow);position:relative}
.composer:focus-within{border-color:var(--acc-2)}
.pending{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px 0}
.pending:empty{display:none}
.pending .file-chip button{border:0;background:transparent;color:var(--faint);padding:0 0 0 2px;font-size:13px;line-height:1}
.composer-row{display:flex;align-items:flex-end;gap:8px;padding:8px 9px}
#input{flex:1;border:0;background:transparent;resize:none;font:inherit;color:var(--ink);padding:5px 2px;max-height:150px;line-height:1.6}
#input:focus{outline:none}
#input::placeholder{color:var(--faint)}
.cbtn{border:1px solid var(--line);background:var(--ground);border-radius:3px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--muted)}
.cbtn:hover{border-color:var(--acc-2);color:var(--acc-2)}
.cbtn.hintme{border-color:var(--brand-edge);background:var(--brand-wash);color:var(--ink)}
.cbtn.send{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.cbtn.send:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;color:var(--faint);padding:6px 2px 0;text-align:center}
.hint code{font-family:var(--mono);font-size:10.5px;background:var(--panel-2);padding:1px 4px;border-radius:2px}

/* slash menu */
.slash{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--ground);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:none;z-index:30}
.slash.open{display:block}
.slash-h{font-size:10.5px;letter-spacing:.14em;color:var(--muted);padding:7px 12px 5px;border-bottom:1px solid var(--line-soft);font-weight:700}
.slash-list{max-height:266px;overflow-y:auto}
.slash-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;border-bottom:1px solid var(--line-soft)}
.slash-item:last-child{border-bottom:0}
.slash-item:hover,.slash-item.sel{background:var(--acc-wash)}
.slash-item .cmd{font-family:var(--mono);font-size:11.5px;color:var(--acc-2);flex:0 0 92px}
.slash-item .d{font-size:12.5px;color:var(--ink-2);min-width:0}
.slash-item .d small{display:block;color:var(--muted);font-size:11.5px}

/* empty state */
.empty{max-width:760px;margin:0 auto;padding:6px 0 0}
.empty .eh{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 6px;text-wrap:balance}
.empty .es{color:var(--ink-2);margin:0 0 14px;font-size:14px;max-width:56ch;line-height:1.85}
.empty-note{font-size:12.5px;color:var(--faint);margin:0;max-width:56ch}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--panel);
  color:var(--ink);font-size:12px;line-height:1;padding:0 4px;vertical-align:-.2em}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:8px}
.tcard{text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);padding:11px 12px;transition:border-color .12s}
.tcard:hover{border-color:var(--acc-2)}
.tcard .n{display:flex;align-items:baseline;gap:7px}

let uid=0; const nid=p=>p+(++uid);
const S={
  folders:[],
  cases:[],
  activeId:null,
  pendingFiles:[]
};
let caseSeq=0;
function autoName(){return "新案件 "+(++caseSeq);}
function isAutoName(n){return /^新案件 \d+$/.test(n);}
function newCase(name,folderId){
  const c={id:nid("c"),name:name||autoName(),folderId:folderId||null,
    dom:null,started:false,
    flags:{extract:false,cases:false,laws:false,graph:false,draft:false,out:false},
    docs:{evidence:[],cases:[],laws:[],out:[]}};
  S.cases.push(c);return c;
}
const active=()=>S.cases.find(c=>c.id===S.activeId);

/* ══════════════════ 左側案件樹 ══════════════════ */
let rootOpen=true, dragId=null;
function buckets(){
  return S.folders.concat([{id:null,name:"未分類",fixed:true,get open(){return rootOpen;},set open(v){rootOpen=v;}}]);
}
function renderTree(){
  const box=$("#tree");box.innerHTML="";
  buckets().forEach(f=>{
    const list=S.cases.filter(c=>c.folderId===f.id);
    const wrap=el("div","tree-folder");
    const row=el("div","tree-row"+(f.open?"":" collapsed")+(f.fixed?" fixed":""));
    row.innerHTML='<span class="tw">▼</span><span class="fname"></span>';
    row.querySelector(".fname").textContent=f.name;
    row.appendChild(el("span","cnt",String(list.length)));
    row.onclick=()=>{f.open=!f.open;renderTree();};
    if(!f.fixed)row.oncontextmenu=e=>{e.preventDefault();folderMenu(e,f);};
    wrap.appendChild(row);
    const kids=el("div","tree-children"+(f.open?"":" hidden"));
    if(!list.length)kids.appendChild(el("div","tree-empty","（拖曳案件到這裡）"));
    list.forEach(c=>kids.appendChild(caseNode(c)));
    wrap.appendChild(kids);

    wrap.addEventListener("dragover",e=>{
      if(!dragId)return;e.preventDefault();
      e.dataTransfer.dropEffect="move";wrap.classList.add("drop");
      if(!f.open){f.open=true;}
    });
    wrap.addEventListener("dragleave",e=>{
      if(!wrap.contains(e.relatedTarget))wrap.classList.remove("drop");
    });
    wrap.addEventListener("drop",e=>{
      e.preventDefault();wrap.classList.remove("drop");
      const c=S.cases.find(x=>x.id===dragId);
      if(!c)return;
      if(c.folderId!==f.id){c.folderId=f.id;toast("已移至「"+f.name+"」");}
      dragId=null;renderTree();
    });
    box.appendChild(wrap);
  });
}
function caseNode(c){
  const n=el("div","case-item"+(c.id===S.activeId?" active":"")+(c.started?" has-work":""));
  n.draggable=true;
  n.appendChild(el("span","dot"));
  const t=el("span","cname");t.textContent=c.name;n.appendChild(t);
  n.appendChild(el("span","grip","⠿"));
  n.onclick=()=>{S.activeId=c.id;renderAll();closeRails();};
  n.oncontextmenu=e=>{e.preventDefault();caseMenu(e,c);};
  n.addEventListener("dragstart",e=>{
    dragId=c.id;n.classList.add("dragging");
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain",c.id);
  });
  n.addEventListener("dragend",()=>{dragId=null;n.classList.remove("dragging");
    document.querySelectorAll(".tree-folder.drop").forEach(x=>x.classList.remove("drop"));});
  return n;
}

/* 右鍵選單 */
const ctx=$("#ctxmenu");
function openCtx(e,items){
  ctx.innerHTML="";
  items.forEach(it=>{
    if(it==="-"){ctx.appendChild(el("hr"));return;}
    const b=el("button",it.danger?"danger":"");b.textContent=it.label;
    b.onclick=()=>{ctx.classList.remove("open");it.fn();};
    ctx.appendChild(b);
  });
  ctx.classList.add("open");
  const w=ctx.offsetWidth,h=ctx.offsetHeight;
  ctx.style.left=Math.min(e.clientX,innerWidth-w-8)+"px";
  ctx.style.top=Math.min(e.clientY,innerHeight-h-8)+"px";
}
addEventListener("click",()=>ctx.classList.remove("open"));
addEventListener("scroll",()=>ctx.classList.remove("open"),true);

function caseMenu(e,c){
  openCtx(e,[
    {label:"重新命名",fn:()=>promptSheet("重新命名案件","案件名稱",c.name,v=>{c.name=v;renderAll();})},
    {label:"移至資料夾⋯",fn:()=>moveSheet(c)},
    {label:"建立副本",fn:()=>{const d=newCase(c.name+"（副本）",c.folderId);S.activeId=d.id;renderAll();}},
    "-",
    {label:"刪除案件",danger:true,fn:()=>{
      if(S.cases.length===1){toast("至少須保留一件案件");return;}
      confirmSheet({
        title:"刪除案件",
        body:`確定要刪除「${esc(c.name)}」嗎？案件內的卷證、案例、法規與草稿都會一併消失，此動作無法復原。`,
        confirmLabel:"刪除案件",
        fn:()=>{
          S.cases=S.cases.filter(x=>x.id!==c.id);
          if(S.activeId===c.id)S.activeId=S.cases[0].id;
          renderAll();toast("案件已刪除");
        }
      });
    }}
  ]);
}
function folderMenu(e,f){
  openCtx(e,[
    {label:"重新命名",fn:()=>promptSheet("重新命名資料夾","資料夾名稱",f.name,v=>{f.name=v;renderTree();})},
    {label:"在此新增案件",fn:()=>{const c=newCase(null,f.id);f.open=true;S.activeId=c.id;renderAll();}},
    "-",
    {label:"刪除資料夾",danger:true,fn:()=>{
      const n=S.cases.filter(x=>x.folderId===f.id).length;
      confirmSheet({
        title:"刪除資料夾",
        body:n?`確定要刪除「${esc(f.name)}」嗎？裡面的 ${n} 件案件會移至「未分類」，資料夾本身無法復原。`
              :`確定要刪除「${esc(f.name)}」嗎？此動作無法復原。`,
        confirmLabel:"刪除資料夾",
        fn:()=>{
          S.cases.forEach(c=>{if(c.folderId===f.id)c.folderId=null;});
          S.folders=S.folders.filter(x=>x.id!==f.id);renderTree();
          toast("資料夾已刪除");
        }
      });
    }}
  ]);
}
function confirmSheet({title,body,confirmLabel,fn}){
  const b=el("div");
  b.innerHTML=`<p style="margin:0;font-size:13.5px;line-height:1.75;color:var(--ink-2)">${body}</p>`;
  openSheet({title,body:b,actions:[
    {label:"取消",fn:closeSheet},
    {label:confirmLabel,danger:true,fn:()=>{closeSheet();fn();}}
  ]});
}

const GROUPS=[
  {key:"evidence",name:"卷證檔案",abbr:"卷",empty:"以聊天室的「＋」上傳訴願書、原處分書、答辯書等卷證。"},
  {key:"cases",name:"相關案例",abbr:"例",empty:"執行「查找相似案例」後，案例卡片會自動歸檔於此。"},
  {key:"laws",name:"相關法規",abbr:"法",empty:"執行「搜尋相關法規」後，法條會自動歸檔於此，可自行增減。"},
  {key:"out",name:"答辯書與產出",abbr:"稿",empty:"草稿與匯出檔案會存放於此。"}
];
const collapsed={};
let touched=[];
function addOne(c,key,item){
  item._new=true;
  c.docs[key].push(item);
  if(!touched.includes(key))touched.push(key);
  return item;
}
const ICON_UPLOAD='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15.5V4.2"/><path d="M7.4 8.6L12 4l4.6 4.6"/><path d="M4.5 15.5v3a2 2 0 002 2h11a2 2 0 002-2v-3"/></svg>';
function renderFolders(){
  const box=$("#folders");box.innerHTML="";
  const c=active();let total=0;
  GROUPS.forEach(g=>{
    const items=c.docs[g.key];total+=items.length;
    const wrap=el("div","fgroup"+(collapsed[g.key]?" collapsed":""));
    wrap.dataset.key=g.key;
    const head=el("div","fgroup-h");
    head.innerHTML=`<span class="tw">▼</span><span class="gn"></span><span class="gc">${items.length}</span>`;
    head.querySelector(".gn").textContent=g.name;
    const isUpload=g.key==="evidence";
    if(g.key!=="out"){
      const add=el("button","add"+(isUpload?" upload":""));
      add.innerHTML=isUpload?ICON_UPLOAD:"＋";
      add.title=isUpload?"上傳卷證檔案":"搜尋並加入";
      add.onclick=ev=>{ev.stopPropagation();isUpload?uploadSheet():searchSheet(g);};
      head.appendChild(add);
    }
    head.onclick=()=>{collapsed[g.key]=!collapsed[g.key];renderFolders();};
    wrap.appendChild(head);
    const body=el("div","fgroup-body");
    if(!items.length)body.appendChild(el("div","fempty",g.empty));
    items.forEach((it,i)=>{
      const row=el("div","fitem"+(it._new?" fitem-new":""));
      row.appendChild(el("span","ic",it.ext||g.abbr));
      const t=el((it.full||it.graph)?"button":"div","ft");
      t.innerHTML=`${esc(it.name)}${it.note?`<small>${esc(it.note)}</small>`:""}`;
      if(it.full||it.graph)t.onclick=()=>docSheet(it);
      row.appendChild(t);
      const rm=el("button","rm","×");rm.title="移除";
      rm.onclick=()=>{items.splice(i,1);renderFolders();toast("已自卷宗移除");};
      row.appendChild(rm);
      body.appendChild(row);
    });
    wrap.appendChild(body);box.appendChild(wrap);
  });
  $("#folder-count").textContent=total?total+" 項":"";
}
function flushTouched(){
  if(!touched.length){renderFolders();return;}
  const keys=touched.slice();touched=[];
  keys.forEach(k=>{collapsed[k]=false;});
  renderFolders();
  requestAnimationFrame(()=>{
    keys.forEach(k=>{
      const g=document.querySelector('.fgroup[data-key="'+k+'"]');
      if(!g)return;
      g.scrollIntoView({behavior:"smooth",block:"nearest"});
      g.classList.add("glow");
      setTimeout(()=>g.classList.remove("glow"),1300);
    });
  });
  setTimeout(()=>{
    const c=active();if(!c)return;
    keys.forEach(k=>c.docs[k]&&c.docs[k].forEach(it=>delete it._new));
  },1500);
}
function searchSheet(g){
  const c=active();

    ? LAW_POOL.map(l=>({name:l.no+"　"+l.title,note:l.note,ext:"法",
        kw:(l.no+l.title+l.note+l.body).toLowerCase(),
        full:`<p style="font-family:var(--serif);line-height:2">${esc(l.body)}</p><p style="color:var(--muted);font-size:12.5px;border-top:1px solid var(--line-soft);padding-top:10px">本案關聯：${esc(l.note)}</p>`}))
    : CASE_POOL.map(k=>({name:k.no+"　"+k.title,note:k.type+"．"+k.verdict+"．相似度 "+k.sim+"%",ext:"例",
        kw:(k.no+k.title+k.type+k.verdict+k.law).toLowerCase(),full:k.full}));
  const have=new Set(c.docs[g.key].map(x=>x.name));

  const b=el("div","searchsheet");
  b.innerHTML=`<div class="ssearch">
      <input class="field" id="ssq" placeholder="輸入關鍵字搜尋，例如法條字號、案由、爭點⋯⋯" autocomplete="off">
      <span class="ssspin" id="ssspin" hidden><span class="spin"></span>搜尋中⋯⋯</span>
    </div>
    <div class="sslist" id="sslist"></div>`;
  openSheet({title:"搜尋並加入"+g.name,sub:g.name+"．後端資料庫",body:b,actions:[
    {label:"取消",fn:closeSheet},
    {label:"加入所選",pri:true,fn:()=>{
      const list=$("#sslist");let n=0;
      list.querySelectorAll("input:checked").forEach(inp=>{
        const item=pool[+inp.dataset.i];
        addOne(c,g.key,{name:item.name,note:item.note,ext:item.ext,full:item.full});
        n++;
      });
      closeSheet();flushTouched();
      toast(n?`已加入 ${n} 項至「${g.name}」`:"未選擇任何項目");
    }}
  ]});

  const q=$("#ssq"),list=$("#sslist"),spin=$("#ssspin");
  function draw(items){
    list.innerHTML="";
    if(!items.length){
      list.appendChild(el("p",null,'<span style="color:var(--faint);font-size:12.5px;display:block;padding:14px 2px">沒有符合的結果，換個關鍵字試試。</span>'));
      return;
    }
    items.forEach(p=>{
      const idx=pool.indexOf(p);
      const r=el("label","pickrow");
      r.innerHTML=`<input type="checkbox" data-i="${idx}"><span class="pt">${esc(p.name)}<small>${esc(p.note||"")}</small></span>`;
      list.appendChild(r);
    });
  }
  function drawIdle(){
    list.innerHTML="";
    list.appendChild(el("p",null,'<span style="color:var(--faint);font-size:12.5px;display:block;padding:14px 2px">輸入關鍵字開始搜尋⋯⋯</span>'));
  }
  function runSearch(){
    const term=q.value.trim().toLowerCase();
    if(!term){drawIdle();return;}
    const avail=pool.filter(p=>!have.has(p.name));
    draw(avail.filter(p=>p.kw.includes(term)));
  }
  drawIdle();
  let deb;
  q.addEventListener("input",()=>{
    clearTimeout(deb);
    if(!q.value.trim()){spin.hidden=true;list.classList.remove("searching");drawIdle();return;}
    spin.hidden=false;list.classList.add("searching");
    deb=setTimeout(()=>{runSearch();spin.hidden=true;list.classList.remove("searching");},420);
  });
  setTimeout(()=>q.focus(),30);
}
function docSheet(it){
  const b=el("div");
  if(it.graph)b.appendChild(buildGraph());else b.innerHTML=it.full;
  openSheet({title:it.name,sub:it.note||"",xwide:!!it.graph,body:b,actions:[{label:"關閉",fn:closeSheet}]});
}

function userMsg(text,files,isCmd){

function aiShell(){

async function toolBlock(host,tool,steps){
  const box=el("div","tool");
  box.innerHTML=`<div class="tool-head">
      <span class="api">${esc(tool.api)}()</span>
      <span class="nm">${esc(tool.name)}</span>
      <span class="st"><span class="spin"></span>執行中</span>
    </div><div class="tool-steps"></div><div class="tool-out"></div>`;
  host.appendChild(box);scrollDown();
  const sBox=box.querySelector(".tool-steps");
  for(const s of steps){
    await sleep(s[1]);
    const r=el("div","step",`<span class="tick">✓</span><span>${esc(s[0])}</span><span class="t">${(s[1]/1000).toFixed(1)}s</span>`);
    sBox.appendChild(r);scrollDown();
  }
  box.querySelector(".st").innerHTML='<span style="color:var(--ok)">✓</span> 完成';
  return box.querySelector(".tool-out");
}

async function runTool(id,arg,silent){
  if(busy)return;const c=active();
  const tool=TOOLS.find(t=>t.id===id);
  if(!silent){userMsg(arg?`${tool.cmd} ${arg}`:tool.cmd,null,true);await sleep(240);}
  pendingAck=pick(ACKS[id]||["好的，這就處理。"]);

  try{await IMPL[id](c,tool,arg);}finally{pendingAck=null;busy=false;c.started=true;renderTree();setChips();flushTouched();renderStages();scrollDown();}
}

  row.append(b1,b2);card.appendChild(row);

 ["f1","i1","support"],["f2","i1","relate"],["f3","i0","relate"],["f4","i0","support"],

];
const GW=150,GH=46,GAPX=54,GAPY=64,PADX=18,PADT=40;
const gx=c=>PADX+c*(GW+GAPX), gy=r=>PADT+r*GAPY;
const GVW=PADX*2+5*GW+4*GAPX, GVH=PADT+5.4*GAPY+GH+26;

function buildGraph(){
  const wrap=el("div","graphwrap");
  const bar=el("div","graphbar");
  bar.innerHTML=`<div class="legend">
    <span><i style="background:var(--n-doc-bg);border:1px solid var(--n-doc)"></i>卷證</span>
    <span><i style="background:var(--n-fact-bg);border:1px solid var(--n-fact)"></i>事實</span>
    <span><i style="background:var(--n-issue-bg);border:1px solid var(--n-issue)"></i>爭點</span>
    <span><i style="background:var(--n-law-bg);border:1px solid var(--n-law)"></i>法規</span>
    <span><i style="background:var(--n-out-bg);border:1px solid var(--n-out)"></i>結論</span>
    <span><i class="ln" style="border-top-color:var(--acc-2)"></i>支持</span>
    <span><i class="ln dash"></i>關聯</span>
    <span><i class="ln bad"></i>爭執／不足</span>
  </div><span class="gb-note">點選節點可追蹤關聯路徑．圖面可左右捲動</span>`;
  wrap.appendChild(bar);

  const sc=el("div","gscroll");
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","gsvg");
  svg.setAttribute("viewBox",`0 0 ${GVW} ${GVH}`);
  svg.setAttribute("width",GVW);svg.setAttribute("height",GVH);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","訴願案件卷證、事實、爭點、法規與結論之關聯圖");

  GCOLS.forEach((n,i)=>{
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class","gcol");t.setAttribute("x",gx(i));t.setAttribute("y",20);
    t.textContent=n;svg.appendChild(t);
  });

  const map={};GNODES.forEach(n=>map[n.id]=n);
  const eg=document.createElementNS(NS,"g");svg.appendChild(eg);
  const paths=[];
  GEDGES.forEach(([a,b,type])=>{
    const A=map[a],B=map[b];
    const x1=gx(A.c)+GW,y1=gy(A.r)+GH/2,x2=gx(B.c),y2=gy(B.r)+GH/2;
    const p=document.createElementNS(NS,"path");
    p.setAttribute("class","edge "+type);
    p.setAttribute("d",`M${x1},${y1} C${x1+42},${y1} ${x2-42},${y2} ${x2},${y2}`);
    eg.appendChild(p);paths.push({a,b,type,el:p});
  });

  const nodeEls={};
  GNODES.forEach(n=>{
    const g=document.createElementNS(NS,"g");
    g.setAttribute("class","gnode");g.setAttribute("tabindex","0");
    g.setAttribute("role","button");g.setAttribute("aria-label",`${GKIND[n.k]}：${n.t}`);
    const r=document.createElementNS(NS,"rect");
    r.setAttribute("x",gx(n.c));r.setAttribute("y",gy(n.r));
    r.setAttribute("width",GW);r.setAttribute("height",GH);r.setAttribute("rx",3);
    r.setAttribute("fill",`var(--n-${n.k}-bg)`);r.setAttribute("stroke",`var(--n-${n.k})`);
    g.appendChild(r);
    const t1=document.createElementNS(NS,"text");
    t1.setAttribute("x",gx(n.c)+11);t1.setAttribute("y",gy(n.r)+17);
    t1.setAttribute("fill","var(--ink)");t1.setAttribute("font-weight","500");
    t1.textContent=n.t;g.appendChild(t1);
    const t2=document.createElementNS(NS,"text");
    t2.setAttribute("class","gt2");t2.setAttribute("x",gx(n.c)+11);t2.setAttribute("y",gy(n.r)+32);
    t2.setAttribute("fill","var(--muted)");t2.textContent=n.s;g.appendChild(t2);
    const act=()=>select(n.id);
    g.addEventListener("click",act);
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});
    svg.appendChild(g);nodeEls[n.id]=g;
  });
  sc.appendChild(svg);wrap.appendChild(sc);

  const det=el("div","gdetail");
  wrap.appendChild(det);
  const KC={doc:"n-doc",fact:"n-fact",issue:"n-issue",law:"n-law",out:"n-out"};
  function showDetail(n,rel){
    det.innerHTML=`<div class="gd-h">
        <span class="gd-k" style="background:var(--${KC[n.k]}-bg);color:var(--${KC[n.k]})">${GKIND[n.k]}</span>
        <span class="gd-t">${esc(n.t)}</span></div>
      <div class="gd-b">${esc(n.d)}</div>
      <div class="gd-s">來源：${esc(n.src)}　·　關聯節點 ${rel} 個</div>`;
  }
  function select(id){
    const linked=new Set([id]);
    paths.forEach(p=>{if(p.a===id)linked.add(p.b);if(p.b===id)linked.add(p.a);});
    paths.forEach(p=>{
      const hot=p.a===id||p.b===id;
      p.el.classList.toggle("hot",hot);p.el.classList.toggle("dim",!hot);
    });
    Object.entries(nodeEls).forEach(([k,g])=>{
      g.classList.toggle("dim",!linked.has(k));
      g.classList.toggle("sel",k===id);
    });
    showDetail(map[id],linked.size-1);
  }
  det.innerHTML=`<div class="gd-b" style="color:var(--muted)">圖中共 ${GNODES.length} 個節點、${GEDGES.length} 條關聯。<b style="color:var(--ink);font-weight:500">紅色虛線</b>標示卷內互相爭執或證據不足之處——本案有 2 條，皆指向爭點一之要件事實認定。點選任一節點可追蹤其關聯路徑。</div>`;
  return wrap;
}

    <p class="indent">原處分撤銷，由原處分機關於 2 個月內另為適法之處分。<span class="cite">訴願法§81 I</span><span class="cite">案例 1147030254</span></p>

    <h4>事實</h4>
    <p class="indent">緣訴願人於本市林口區○○路 88 號設廠從事塑膠製品製造，為原處分機關列管之事業。原處分機關於民國（下同）114 年 4 月 9 日派員前往稽查，查得廠區東側露天堆置未分類之廢塑膠混合物及廢木材約 12 立方公尺，且未設置防止地面水、雨水流入之設施<span class="cite">卷證·稽查工作紀錄</span>，認訴願人違反廢棄物清理法第 36 條第 1 項規定，爰依同法第 52 條及新北市政府處理違反廢棄物清理法事件裁罰基準規定，以 114 年 5 月 20 日新北環稽字第 1140876543 號裁處書（下稱系爭處分書），處訴願人新臺幣（下同）6 萬元罰鍰，並限期於 114 年 6 月 30 日前完成改善<span class="cite">卷證·原處分書</span>。訴願人不服，於 114 年 6 月 16 日提起本件訴願，並據原處分機關檢卷答辯到府。茲摘敘訴辯意旨於次：</p>
    <p class="indent">一、訴願意旨略謂：系爭堆置物為可回收再利用之產源物料，仍具經濟價值，非屬廢棄物；稽查當日正進行分類整理，屬作業中之暫時放置；原處分機關作成處分前未給予陳述意見機會；訴願人初次違規且已即時改善，裁罰過重等語<span class="cite">卷證·訴願書</span>。</p>
    <p class="indent">二、答辯意旨略謂：現場堆置物已與雨水、泥土混雜，客觀上難認仍具原效用；訴願人為列管事業，本負有依規定貯存之義務；原處分係依裁罰基準所定額度作成，並無違誤等語<span class="cite">卷證·答辯書</span>。</p>

    <h4>理由</h4>
    <p class="indent">一、按廢棄物清理法第 36 條第 1 項規定：「事業廢棄物之貯存、清除或處理方法及設施，應符合中央主管機關之規定。」同法第 52 條規定：「貯存、清除、處理或再利用一般事業廢棄物違反第 36 條第 1 項……規定者，處新臺幣 6 千元以上 300 萬元以下罰鍰，並限期改善……。」<span class="cite">廢清法§36 I</span><span class="cite">廢清法§52</span></p>
    <p class="indent">二、次按同法第 2 條第 1 項第 2 款規定，廢棄物指能以搬動方式移動之固態或液態物質，而有「減失原效用、被放棄原效用、不具效用或效用不明」情形者<span class="cite">廢清法§2 I</span>。是物品是否該當廢棄物，應就其物理狀態、有無交易價值及事業之處置意思綜合判斷，非得僅憑堆置外觀逕予推認<span class="cite">案例 1143058447</span>。</p>
    <p class="indent">三、再按行政程序法第 102 條規定，行政機關作成限制或剝奪人民自由或權利之行政處分前，除已依第 39 條通知陳述意見或決定舉行聽證者外，應給予處分相對人陳述意見之機會；同法第 114 條第 1 項第 3 款及第 2 項則規定，應給予陳述意見之機會已於事後給予者，其程序瑕疵得予補正，惟補正行為僅得於訴願程序終結前為之<span class="cite">行程法§102</span><span class="cite">行程法§114 I③</span>。</p>
    <p class="indent">四、卷查訴願人所有系爭廠址經原處分機關於 114 年 4 月 9 日稽查，現場堆置廢塑膠混合物及廢木材，未設置防止雨水流入之設施，此有稽查工作紀錄及採證照片附卷可稽<span class="cite">卷證·稽查工作紀錄</span>，原處分機關據以認定訴願人違反貯存規定，固非無據。</p>
    <p class="indent">五、惟查，遍查全卷，並無原處分機關依行政程序法第 102 條規定通知訴願人陳述意見之相關文書可稽<span class="cite">卷證·全卷</span>，亦未依同法第 39 條規定通知陳述意見或決定舉行聽證；又原處分機關迄本件訴願程序終結前，仍未依同法第 114 條第 1 項第 3 款規定事後給予陳述意見之機會以為補正<span class="cite">行程法§114 I③</span>，其踐行之行政程序即難謂無瑕疵<span class="cite">案例 1143041902</span>。</p>
    <p class="indent">六、又系爭堆置物是否該當廢棄物清理法第 2 條第 1 項第 2 款所稱「減失原效用」之廢棄物，攸關處罰要件是否具備。卷附採證照片僅呈現堆置外觀，原處分機關就系爭物料之成分、有無交易價值、訴願人有無再利用申報或流向文件等節，均未見調查認定<span class="cite">卷證·稽查工作紀錄</span><span class="cite">案例 1143062011</span>，其事實認定之基礎尚有未足。另原處分書就行政罰法第 18 條第 1 項所定應受責難程度、所生影響及所得利益等裁量事由，亦未見具體審酌之記載<span class="cite">行政罰法§18 I</span>。</p>
    <p class="indent">七、綜上論結，本件訴願為有理由，爰將原處分撤銷，由原處分機關於 2 個月內查明後另為適法之處分，依訴願法第 81 條第 1 項規定，決定如主文<span class="cite">訴願法§81 I</span>。</p>
  </div>
  <div class="nohallu"><span style="color:var(--acc-2)">◆</span><span><b style="color:var(--ink);font-weight:500">來源控管</b>　全文 14 處引註，皆對應右側卷宗之卷證、法規或案例；卷宗以外之資料一律不予採用，亦未生成任何無來源之法條字號或案號。承辦人核校時，可逐一點按引註回溯原文。</span></div>
</div>`;

function setChips(){
  const box=$("#chips");box.innerHTML="";
  const c=active();if(!c)return;
  if(busy){box.appendChild(el("span","chip ghost","工具執行中⋯⋯"));return;}
  const f=c.flags;const add=(label,fn,lead)=>{
    const b=el("button","chip");
    b.innerHTML=(lead?`<span class="lead">${lead}</span>`:"")+esc(label);
    b.onclick=fn;box.appendChild(b);
  };
  if(!c.docs.evidence.length){
    add("上傳卷證檔案",()=>attachSheet(),"＋");
    add("你會什麼？",()=>{$("#input").value="你會什麼？";send();},"?");
    return;
  }
  if(!f.extract){add("萃取答辯書",()=>runTool("extract"),"▸");}
  if(f.extract&&!f.cases)add("查找相似案例",()=>runTool("cases"),"▸");
  if(f.extract&&!f.laws)add("搜尋相關法規",()=>runTool("laws"),"▸");
  if(f.extract&&!f.graph)add("生成關聯圖",()=>runTool("graph"),"▸");
  if(f.cases&&f.laws&&!f.draft)add("生成決定書草稿",()=>runTool("draft"),"▸");
  if(f.draft){
    add("優化文案：語氣更嚴謹",()=>runTool("refine","語氣更嚴謹、論理更緊密"),"▸");
    add("補充相關法規",()=>searchSheet(GROUPS[2]),"＋");
    if(f.graph)add("重繪關聯圖",()=>runTool("graph"),"▸");
    if(!f.out){add("生成 PDF",()=>runTool("pdf"),"▸");add("生成 DOC",()=>runTool("doc"),"▸");}
    else{add("重新生成 PDF",()=>runTool("pdf"),"▸");add("生成 DOC",()=>runTool("doc"),"▸");}
  }
  if(f.extract&&!f.draft)add("再上傳卷證",()=>attachSheet(),"＋");
  if(!box.children.length)add("你會什麼？",()=>{$("#input").value="你會什麼？";send();},"?");
}
function renderStages(){
  const c=active();const box=$("#stages");box.innerHTML="";
  ["extract","cases","laws","graph","draft","out"].forEach(k=>{
    box.appendChild(el("span","stage-pip"+(c.flags[k]?" on":"")));
  });
}

/* ══════════════════ 上傳 ══════════════════ */
function attachSheet(){
  const c=active();
  const have=new Set(c.docs.evidence.map(x=>x.name).concat(S.pendingFiles.map(x=>x.name)));
  const avail=EVIDENCE_POOL.filter(f=>!have.has(f.name));
  const b=el("div");
  b.appendChild(el("p",null,'<span style="color:var(--muted);font-size:12.5px">原型展示：以下為模擬的本機卷證檔案，勾選後將附加至訊息並觸發萃取工具。</span>'));
  const list=el("div");
  if(!avail.length)list.appendChild(el("p",null,'<span style="color:var(--faint);font-size:12.5px">示範檔案皆已上傳。</span>'));
  avail.forEach((f,i)=>{
    const r=el("label","pickrow");
    r.innerHTML=`<input type="checkbox" checked><span class="pt">${esc(f.name)}<small>${esc(f.note)}</small></span>`;
    r.querySelector("input").dataset.i=i;list.appendChild(r);
  });
  b.appendChild(list);
  openSheet({title:"選擇卷證檔案",sub:"本機檔案",body:b,actions:[
    {label:"取消",fn:closeSheet},
    {label:"附加至訊息",pri:true,fn:()=>{
      list.querySelectorAll("input:checked").forEach(inp=>S.pendingFiles.push(avail[+inp.dataset.i]));
      closeSheet();renderPending();$("#input").focus();
    }}
  ]});
}
function uploadSheet(){
  const c=active();
  const have=new Set(c.docs.evidence.map(x=>x.name));
  const avail=EVIDENCE_POOL.filter(f=>!have.has(f.name));
  const b=el("div");
  b.appendChild(el("p",null,'<span style="color:var(--muted);font-size:12.5px">原型展示：以下為模擬的本機卷證檔案，勾選後直接上傳至卷宗。</span>'));
  const list=el("div");
  if(!avail.length)list.appendChild(el("p",null,'<span style="color:var(--faint);font-size:12.5px">示範檔案皆已上傳。</span>'));
  avail.forEach((f,i)=>{
    const r=el("label","pickrow");
    r.innerHTML=`<input type="checkbox" checked><span class="pt">${esc(f.name)}<small>${esc(f.note)}</small></span>`;
    r.querySelector("input").dataset.i=i;list.appendChild(r);
  });
  b.appendChild(list);
  openSheet({title:"上傳卷證檔案",sub:"卷證檔案",body:b,actions:[
    {label:"取消",fn:closeSheet},
    {label:"上傳",pri:true,fn:()=>{
      let n=0;
      list.querySelectorAll("input:checked").forEach(inp=>{addOne(c,"evidence",avail[+inp.dataset.i]);n++;});
      closeSheet();
      if(n){
        c.started=true;renderTree();$("#attach").classList.remove("hintme");
        if(isAutoName(c.name)){c.name="吉○實業／違反廢清法";}
      }
      flushTouched();
      toast(n?`已上傳 ${n} 份卷證`:"未選擇任何檔案");
    }}
  ]});
}
function renderPending(){
  const p=$("#pending");p.innerHTML="";
  S.pendingFiles.forEach((f,i)=>{
    const chip=el("span","file-chip",`<span class="ext">${esc(f.ext)}</span>${esc(f.name)}`);
    const x=el("button",null,"×");x.setAttribute("aria-label","移除");
    x.onclick=()=>{S.pendingFiles.splice(i,1);renderPending();};
    chip.appendChild(x);p.appendChild(chip);
  });
}

/* ══════════════════ 訊息處理 ══════════════════ */
function toolListHTML(){
  return `<p>我是訴願案件的辦案助理。目前開放 7 支工具（API），可用「/」呼叫，也可以直接用中文描述需求：</p>`;
}
function renderToolCards(host){
  const grid=el("div","toolgrid");
  TOOLS.forEach((t,i)=>{
    const b=el("button","tcard");
    b.innerHTML=`<div class="n"><span class="idx">${String(i+1).padStart(2,"0")}</span><span class="nm">${esc(t.name)}</span></div>
      <div class="api">${esc(t.api)}(${esc(t.param)})</div>
      <div class="ds">${esc(t.desc)}</div>`;
    b.onclick=()=>runTool(t.id);
    grid.appendChild(b);
  });
  host.appendChild(grid);
  host.appendChild(el("p",null,'<span style="color:var(--muted);font-size:12.5px;display:block;margin-top:12px">工具會依卷宗狀態自動檢核前提條件——例如未備妥法規與案例時，草稿生成會拒絕執行，以避免產生無來源之論述。</span>'));
}

function matchTool(text){
  const t=text.toLowerCase();
  for(const tool of TOOLS){
    if(t.startsWith(tool.cmd.toLowerCase()))return tool;
  }
  for(const tool of TOOLS){
    if(tool.kw.some(k=>t.includes(k.toLowerCase())))return tool;
  }
  return null;
}

let sendLock=false;
async function send(){
  if(sendLock||busy)return;
  const inp=$("#input");
  const text=inp.value.trim();
  const files=S.pendingFiles.slice();
  if(!text&&!files.length)return;
  sendLock=true;
  try{
    const c=active();
    inp.value="";autosize();S.pendingFiles=[];renderPending();closeSlash();
    userMsg(text||"（附加檔案）",files);
    if(files.length){
      files.forEach(f=>{if(!c.docs.evidence.some(x=>x.name===f.name))addOne(c,"evidence",{name:f.name,note:f.note,ext:f.ext});});
      c.started=true;renderTree();$("#attach").classList.remove("hintme");
      if(isAutoName(c.name)){c.name="吉○實業／違反廢清法";}
      flushTouched();
    }
    await sleep(280);

    if(/你會什麼|會做什麼|有哪些工具|有什麼工具|能做什麼|功能|help|工具清單/i.test(text)){
      const h=aiShell();h.innerHTML=toolListHTML();renderToolCards(h);scrollDown();setChips();return;
    }
    const tool=text?matchTool(text):null;
    if(tool){
      let arg="";
      if(tool.id==="refine")arg=text.replace(tool.cmd,"").replace(/優化文案|優化|修潤|潤稿/g,"").trim();
      await runTool(tool.id,arg,true);return;
    }
    if(files.length&&!text){
      aiMsg(`<p>已收到 ${files.length} 份卷證並歸檔至右側「卷證檔案」。是否要開始萃取？點選下方的「萃取答辯書」，或直接輸入 <code style="font-family:var(--mono);font-size:11.5px">/萃取答辯書</code>。</p>`);
      setChips();return;
    }
    aiMsg('<p>這句我沒對到工具。可以按 <code style="font-family:var(--mono);font-size:11.5px">/</code> 查看可呼叫的工具清單，或輸入「你會什麼」讓我列出全部 7 支 API。</p>');
    setChips();
  } finally {
    sendLock=false;
  }
}

/* ══════════════════ 斜線選單 ══════════════════ */
let slashSel=0;
function openSlash(filter){
  const list=$("#slash-list");list.innerHTML="";
  const items=TOOLS.filter(t=>!filter||t.cmd.includes(filter)||t.name.includes(filter));
  if(!items.length){closeSlash();return;}
  items.forEach((t,i)=>{
    const b=el("button","slash-item"+(i===slashSel?" sel":""));
    b.innerHTML=`<span class="cmd">${esc(t.cmd)}</span><span class="d">${esc(t.name)}<small>${esc(t.desc)}</small></span>`;
    b.onclick=()=>{fillSlash(t);};
    list.appendChild(b);
  });
  $("#slash").classList.add("open");
  $("#slash").dataset.items=items.map(t=>t.id).join(",");
}
function closeSlash(){$("#slash").classList.remove("open");slashSel=0;}
function fillSlash(t){
  const inp=$("#input");
  inp.value=t.cmd+" ";
  closeSlash();autosize();inp.focus();
  const len=inp.value.length;inp.setSelectionRange(len,len);
}

  const sh=el("div","sheet"+(xwide?" xwide":wide?" wide":""));
  const h=el("div","sheet-h");
  h.innerHTML=`<h3></h3><span class="sub"></span>`;
  h.querySelector("h3").textContent=title;
  h.querySelector(".sub").textContent=sub||"";
  const x=el("button","x","×");x.setAttribute("aria-label","關閉");x.onclick=closeSheet;h.appendChild(x);
  const b=el("div","sheet-b");b.appendChild(body);
  const f=el("div","sheet-f");
  (actions||[]).forEach(a=>{const btn=el("button","btn"+(a.danger?" danger":a.pri?" pri":""));btn.textContent=a.label;btn.onclick=a.fn;f.appendChild(btn);});
  sh.append(h,b,f);scrim.appendChild(sh);
  scrim.onclick=e=>{if(e.target===scrim)closeSheet();};
  $("#modal-root").appendChild(scrim);sheetEl=scrim;

}
function closeSheet(){if(sheetEl){sheetEl.remove();sheetEl=null;}}
addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeSlash();ctx.classList.remove("open");}});

function promptSheet(title,label,val,fn){
  const b=el("div");
  b.innerHTML=`<label class="flabel" for="pv">${esc(label)}</label><input class="field" id="pv">`;
  openSheet({title,body:b,actions:[
    {label:"取消",fn:closeSheet},
    {label:"確定",pri:true,fn:()=>{const v=$("#pv").value.trim();if(v)fn(v);closeSheet();}}
  ]});
  const i=$("#pv");i.value=val;i.select();
  i.onkeydown=e=>{if(e.key==="Enter"){const v=i.value.trim();if(v)fn(v);closeSheet();}};
}
function moveSheet(c){
  const b=el("div");
  if(!S.folders.length){
    b.innerHTML='<p style="font-size:13px;color:var(--muted);margin:0">尚未建立任何資料夾。請先於左下角點選「＋ 資料夾」。</p>';
    openSheet({title:"移至資料夾",body:b,actions:[{label:"關閉",fn:closeSheet}]});return;
  }
  S.folders.forEach(f=>{
    const r=el("label","pickrow");
    r.innerHTML=`<input type="radio" name="mv" ${c.folderId===f.id?"checked":""}><span class="pt">${esc(f.name)}</span>`;
    r.querySelector("input").onchange=()=>{c.folderId=f.id;f.open=true;};
    b.appendChild(r);
  });
  const r0=el("label","pickrow");
  r0.innerHTML=`<input type="radio" name="mv" ${!c.folderId?"checked":""}><span class="pt">未分類</span>`;
  r0.querySelector("input").onchange=()=>{c.folderId=null;};
  b.appendChild(r0);
  openSheet({title:"移至資料夾",sub:c.name,body:b,actions:[{label:"完成",pri:true,fn:()=>{closeSheet();renderTree();}}]});
}
let toastT;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);
}

/* ══════════════════ 空狀態 ══════════════════ */
function emptyState(){
  const h=new Date().getHours();
  const hi=h<5?"夜深了":h<11?"早安":h<18?"午安":"晚安";
  const w=el("div","empty");
  w.innerHTML=`<h2 class="eh">${hi}，我是訴小願。</h2>
    <p class="es">你的訴願小助手。從下面的 <span class="kbd">＋</span> 開始，把卷證丟進來吧。</p>`;
  return w;
}

/* ══════════════════ Render ══════════════════ */
function renderAll(){
  const c=active();
  $("#case-title").textContent=c.name;
  $("#case-meta").textContent=c.docs.evidence.length
    ? `案號 ${CASE_NO}．卷證 ${c.docs.evidence.length} 份`
    : "尚未載入卷證";
  const s=stream();s.innerHTML="";
  if(!c.dom||!c.dom.children.length){s.appendChild(emptyState());}
  else s.appendChild(c.dom);
  $("#attach").classList.toggle("hintme",!c.docs.evidence.length);
  renderTree();renderFolders();setChips();renderStages();scrollDown();
}

/* ══════════════════ 綁定 ══════════════════ */
const inp=$("#input");
function autosize(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,150)+"px";}
inp.addEventListener("input",()=>{
  autosize();
  const v=inp.value;
  if(v.startsWith("/"))openSlash(v.length>1?v:"");else closeSlash();
});
inp.addEventListener("keydown",e=>{
  const open=$("#slash").classList.contains("open");
  if(open&&(e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault();
    const items=[...$("#slash-list").children];
    slashSel=(slashSel+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;
    items.forEach((n,i)=>n.classList.toggle("sel",i===slashSel));
    items[slashSel].scrollIntoView({block:"nearest"});return;
  }
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    if(e.repeat)return;
    if(open){const items=[...$("#slash-list").children];(items[slashSel]||items[0]).click();return;}
    if(sendLock||busy)return;
    send();
  }
});
$("#send").onclick=send;
$("#attach").onclick=attachSheet;
$("#new-case").onclick=()=>{
  const c=newCase(null,active()?active().folderId:null);
  S.activeId=c.id;renderAll();
  toast("已建立「"+c.name+"」，上傳卷證後會自動命名");
};
$("#new-folder").onclick=()=>{
  promptSheet("新增資料夾","資料夾名稱","新資料夾",v=>{
    S.folders.push({id:nid("f"),name:v,open:true});renderTree();
  });
};
/* 主題切換：半日半月 */
const ROOT=document.documentElement;
const MQ=window.matchMedia("(prefers-color-scheme: dark)");
const curTheme=()=>ROOT.getAttribute("data-theme")||(MQ.matches?"dark":"light");
function syncTheme(){
  const dark=curTheme()==="dark";
  const b=$("#theme");
  b.title=dark?"切換為淺色":"切換為深色";
  b.setAttribute("aria-label",b.title);
  b.setAttribute("aria-pressed",String(dark));
}
$("#theme").onclick=()=>{ROOT.setAttribute("data-theme",curTheme()==="dark"?"light":"dark");syncTheme();};
if(MQ.addEventListener)MQ.addEventListener("change",syncTheme);
syncTheme();

$("#tgl-left").onclick=()=>document.body.classList.toggle("left-open");
$("#tgl-right").onclick=()=>document.body.classList.toggle("right-open");
$("#scrim-rail").onclick=closeRails;
function closeRails(){document.body.classList.remove("left-open","right-open");}

/* 啟動：完全空白 */
const first=newCase(null,null);
S.activeId=first.id;
renderAll();
</script>
